动；没有通过/安全的自动判断。"]},"origin":{"type":"source_corrected","sourceSummary":"原片结尾给出耐压、RDS(on)、电流、SOA、开关五步。","addedOrCorrected":"保留顺序，去掉48V必选100V、26A固定限流等可能的无条件理解。"}},{"id":"selection-units","title":"mΩ、nC、kHz先怎么换单位？","pitfall":"漏掉数量级，算出的损耗或时间相差一千倍。","steps":["m表示千分之一：1 mΩ=0.001 Ω；µ表示百万分之一：1 µs=0.000001 s。","n表示十亿分之一：1 nC=10⁻⁹ C；p表示万亿分之一：1 pF=10⁻¹² F。","k表示一千：1 kHz=1000次/秒。先把各量换到公式使用的单位，再计算。"],"takeaway":"单位一起参与运算；先换单位再代入。","formula":null,"sources":[{"title":"原作者MOS选型作品的参数单位","url":"https://www.douyin.com/video/7697709154601974257"}],"visual":{"kind":"comparison","labels":["m：10⁻³","µ：10⁻⁶","n：10⁻⁹","p：10⁻¹²","k：10³"],"values":{"isIllustrative":true,"mode":"unit-conversion"},"notes":["固定单位对照尺，仅高亮一条换算关系，不自动切页。"]},"origin":{"type":"review_supplement","sourceSummary":"原片使用mΩ、nC、ns、kHz等单位但未逐项解释换算。","addedOrCorrected":"为初学者增加数量级基础。"}}]},{"id":"7698099047316534245","key":"gate","title":"栅电阻：怎样把速度与应力一起算？","intro":"从电荷和电流出发，逐步估算速度、损耗、过冲与误导通，再纠正原图关断支路的等效阻值。所有候选阻值都需要实际验证。","sourceUrl":"https://www.douyin.com/video/7698099047316534245","scope":"本模块来自这条已审画面及独立核验；不是原片逐字转录。示意动画不代表实测，补充算例另作标注。","lessons":[{"id":"gate-tradeoff","title":"栅电阻越小越好吗？","pitfall":"只追求最快切换而忽略尖峰、恢复和干扰。","steps":["减小阻抗通常让栅极充放电更快。","更快可能降低一部分重叠损耗，也可能加剧电压尖峰和干扰。","分别确定开通与关断限制，再找可验证的候选值。"],"takeaway":"栅电阻是多项约束的结果，没有通用最好阻值。","formula":null,"sources":[{"title":"TI Fundamentals of MOSFET and IGBT Gate Driver Circuits, SLUA618A","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"},{"title":"Infineon EiceDRIVER Gate resistor for power devices, AN2015-06","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-eicedriver-gate-resistor-for-power-devices-applicationnotes-en.pdf"}],"visual":{"kind":"gate","labels":["速度","损耗","尖峰","抗干扰"],"values":{"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["K1"],"sourceSummary":"用1.6Ω与20Ω对比开关损耗和关断峰值，引出不能只追求最快或最慢。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"gate-charge","title":"估算主要开关区间，该用哪段电荷？","pitfall":"把总Qg和米勒平台电荷混成同一个数字。","steps":["先沿栅极电荷曲线找到阈值附近。","接着识别电流上升段和漏源电压变化的平台段。","只把本次要估的阶段电荷相加。"],"takeaway":"先定义区间，才能用电荷除以电流算时间。","formula":{"expression":"Qsw=(Qgs−Qg(th))+Qgd","variables":[{"symbol":"Qsw","meaning":"本模型主要转换区间电荷","unit":"nC"},{"symbol":"Qgs","meaning":"到平台开始的电荷","unit":"nC"},{"symbol":"Qg(th)","meaning":"到阈值附近的电荷","unit":"nC"},{"symbol":"Qgd","meaning":"米勒区电荷","unit":"nC"}],"substitution":"原片典型值：(29−19)+26=36nC；总Qg为106nC。","explanation":"36nC只包含选定转换段，后续把栅极充到10V还需电荷。","conditions":"50V、25A、0→10V典型测试；条件改变时不能固定沿用。"},"sources":[{"title":"Infineon ISC019N10NM8SC datasheet, Rev.1.0, 2025-12-12","url":"https://www.infineon.com/assets/row/public/documents/24/49/infineon-isc019n10nm8sc-datasheet-en.pdf"}],"visual":{"kind":"gate","labels":["阈值","电流变化","米勒平台","最终栅压"],"values":{"Qgth_nC":19,"Qgs_nC":29,"Qgd_nC":26,"Qsw_nC":36,"Qg_nC":106,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["K2"],"sourceSummary":"以ISC019N10NM8SC为例列Qgs/Qg(th)/Qgd/Qsw/平台电压/内部栅阻，再算开关栅电流。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"gate-current-on","title":"平台时10V驱动能提供多大栅电流？","pitfall":"用10V直接除电阻，忘了栅极已经升高。","steps":["驱动端与栅极之间的电压差推动电流。","平台约4.2V时，10V驱动只剩5.8V差值。","把外部、内部和驱动输出阻抗都算进路径。"],"takeaway":"平台电流不同于充电刚开始的峰值。","formula":{"expression":"Ig,on≈(Vdrv−Vpl)/Ron,total","variables":[{"symbol":"Ig,on","meaning":"平台附近开通栅电流","unit":"A"},{"symbol":"Vdrv","meaning":"驱动高电平","unit":"V"},{"symbol":"Vpl","meaning":"平台电压","unit":"V"},{"symbol":"Ron,total","meaning":"实际开通总电阻","unit":"Ω"}],"substitution":"原片忽略驱动内阻： (10−4.2)/(1.6+0.8)≈2.417A。","explanation":"平台已经占用了部分电压，剩余电压才落在电阻上。","conditions":"恒平台近似；驱动器限流、二极管压降和寄生还可能改变结果。"},"sources":[{"title":"TI Fundamentals of MOSFET and IGBT Gate Driver Circuits, SLUA618A","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"},{"title":"Infineon EiceDRIVER Gate resistor for power devices, AN2015-06","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-eicedriver-gate-resistor-for-power-devices-applicationnotes-en.pdf"}],"visual":{"kind":"gate","labels":["10V驱动","4.2V平台","2.4Ω总阻"],"values":{"drive_V":10,"plateau_V":4.2,"total_ohm":2.4,"current_A":2.4166666666666665,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["K2"],"sourceSummary":"以ISC019N10NM8SC为例列Qgs/Qg(th)/Qgd/Qsw/平台电压/内部栅阻，再算开关栅电流。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"gate-current-off","title":"相同电阻，关断电流为何可能更小？","pitfall":"把开通和关断时的电压差看成相同。","steps":["开通时从高电平给栅极送电荷。","0V关断时，平台到0V的差值只有平台电压。","比较实际两个路径，不假定所有驱动都具有同样强度。"],"takeaway":"原片中关断较慢是这组条件的结果，不是器件天性。","formula":{"expression":"Ig,off≈(Vpl−Voff)/Roff,total","variables":[{"symbol":"Ig,off","meaning":"平台附近关断抽电荷电流","unit":"A"},{"symbol":"Vpl","meaning":"平台电压","unit":"V"},{"symbol":"Voff","meaning":"关断电平","unit":"V"},{"symbol":"Roff,total","meaning":"实际关断总电阻","unit":"Ω"}],"substitution":"独立路径示例：(4.2−0)/2.4=1.75A。","explanation":"抽走电荷的速度由平台到关断电平的差值决定。","conditions":"负压、不同驱动灌阻、并联支路会改变结果。"},"sources":[{"title":"TI Fundamentals of MOSFET and IGBT Gate Driver Circuits, SLUA618A","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"},{"title":"TI TIDA-010023 reference design guide, TIDUEF6","url":"https://www.ti.com/lit/ug/tiduef6/tiduef6.pdf"}],"visual":{"kind":"gate","labels":["4.2V平台","0V关断","抽走电荷"],"values":{"plateau_V":4.2,"off_V":0,"total_ohm":2.4,"current_A":1.75,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["K2"],"sourceSummary":"以ISC019N10NM8SC为例列Qgs/Qg(th)/Qgd/Qsw/平台电压/内部栅阻，再算开关栅电流。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"gate-time","title":"36nC转换电荷需要多少时间？","pitfall":"把驱动器标题峰值电流当成整个过程恒定电流。","steps":["选好转换区间电荷。","估算该区间的实际平均栅电流。","两者相除只得到这个区间的近似时长。"],"takeaway":"转换时间不等于包含所有延迟的完整开关时间。","formula":{"expression":"tsw≈Qsw/Ig","variables":[{"symbol":"tsw","meaning":"指定转换区间时长","unit":"s"},{"symbol":"Qsw","meaning":"该区间电荷","unit":"C"},{"symbol":"Ig","meaning":"该区间近似栅电流","unit":"A"}],"substitution":"原片模型：36nC/2.417A≈14.90ns。","explanation":"转移同样电荷，电流越小，时间越长。","conditions":"电流、平台、电荷在真实过程中会变化；不是保证值。"},"sources":[{"title":"Infineon ISC019N10NM8SC datasheet, Rev.1.0, 2025-12-12","url":"https://www.infineon.com/assets/row/public/documents/24/49/infineon-isc019n10nm8sc-datasheet-en.pdf"},{"title":"TI Fundamentals of MOSFET and IGBT Gate Driver Circuits, SLUA618A","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"}],"visual":{"kind":"gate","labels":["36nC","2.417A","14.90ns"],"values":{"charge_nC":36,"current_A":2.4166666666666665,"time_ns":14.896551724137932,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["K3"],"sourceSummary":"Qsw/Ig估算时长，三角重叠能量乘频率，比较四组阻值。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"gate-energy","title":"电压和电流重叠时怎样估算能量？","pitfall":"把高电压或大电流单独当作损耗。","steps":["损耗取决于电压与电流同时存在的那段时间。","用线性斜坡作一阶模型，重叠面积近似三角形。","分别算开通和关断，再加其他损耗项。"],"takeaway":"三角估算只覆盖指定重叠部分。","formula":{"expression":"Eoverlap≈0.5 Vbus I tsw","variables":[{"symbol":"Eoverlap","meaning":"一次转换重叠能量","unit":"J"},{"symbol":"Vbus","meaning":"母线电压","unit":"V"},{"symbol":"I","meaning":"换流电流","unit":"A"},{"symbol":"tsw","meaning":"重叠转换时长","unit":"s"}],"substitution":"原片模型：0.5×50V×25A×14.90ns≈9.31µJ。","explanation":"伏安乘秒得到焦耳。","conditions":"线性硬开关近似；Qrr、Coss、二极管和导通热不全在这里。"},"sources":[{"title":"TI Fundamentals of MOSFET and IGBT Gate Driver Circuits, SLUA618A","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"}],"visual":{"kind":"thermal","labels":["电压","电流","重叠面积"],"values":{"bus_V":50,"current_A":25,"time_ns":14.9,"energy_uJ":9.3125,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["K3"],"sourceSummary":"Qsw/Ig估算时长，三角重叠能量乘频率，比较四组阻值。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"gate-power","title":"每次几微焦，怎么变成每秒发热？","pitfall":"混淆单次能量与平均功率。","steps":["把一次开通和一次关断的能量相加。","乘每秒经历的开关周期数。","用瓦数进入热预算，而不是把焦耳直接当温升。"],"takeaway":"频率增加会累计更多转换损耗。","formula":{"expression":"Psw≈(Eon+Eoff)fsw","variables":[{"symbol":"Psw","meaning":"平均开关损耗","unit":"W"},{"symbol":"Eon,Eoff","meaning":"每次开通与关断能量","unit":"J"},{"symbol":"fsw","meaning":"开关频率","unit":"Hz"}],"substitution":"原片近似：(9.31+12.86)µJ×20kHz≈0.443W。","explanation":"每次多少热，乘每秒多少次，就是每秒多少热。","conditions":"仅当前重叠模型，不是器件总损耗。"},"sources":[{"title":"TI Fundamentals of MOSFET and IGBT Gate Driver Circuits, SLUA618A","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"}],"visual":{"kind":"thermal","labels":["开通能量","关断能量","每秒次数"],"values":{"on_uJ":9.31,"off_uJ":12.86,"frequency_Hz":20000,"power_W":0.4434,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["K3"],"sourceSummary":"Qsw/Ig估算时长，三角重叠能量乘频率，比较四组阻值。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"gate-ratio","title":"20Ω的损耗为何说是1.6Ω的8.7倍？","pitfall":"把8.7倍理解成整机损耗或效率变化。","steps":["在原片模型里，电荷和平台保持不变。","转换时间近似跟总栅阻成正比，重叠损耗也随之变化。","比例要计入内部0.8Ω，而不是只除外部电阻。"],"takeaway":"8.7倍属于固定参数模型中的一项损耗。","formula":{"expression":"P20/P1.6≈(20+0.8)/(1.6+0.8)","variables":[{"symbol":"P20,P1.6","meaning":"相应阻值下模型重叠损耗","unit":"W"}],"substitution":"20.8/2.4≈8.67。","explanation":"内部电阻也限制栅电流，不能从比较中删除。","conditions":"忽略驱动内阻且电荷/波形假设不变；不是实测总损耗倍数。"},"sources":[{"title":"TI Fundamentals of MOSFET and IGBT Gate Driver Circuits, SLUA618A","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"}],"visual":{"kind":"thermal","labels":["1.6Ω外阻","20Ω外阻","共同0.8Ω内阻"],"values":{"smallExternal_ohm":1.6,"largeExternal_ohm":20,"internal_ohm":0.8,"ratio":8.666666666666668,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_corrected","sourcePointIds":["K3"],"sourceSummary":"Qsw/Ig估算时长，三角重叠能量乘频率，比较四组阻值。","addedOrCorrected":"限定8.7倍的统计对象。"}},{"id":"gate-off-spike","title":"关得更快，为什么电压峰值更高？","pitfall":"把关断速度只看成减少损耗的好事。","steps":["电流下降时，回路电感会反抗变化。","相同电流在更短时间内降完，感应电压更大。","用目标峰值和实测波形约束关断速度。"],"takeaway":"估算可筛查，实际尖峰仍须在目标板测量。","formula":{"expression":"ΔV≈Lσ I/tfi","variables":[{"symbol":"ΔV","meaning":"电感过冲量级","unit":"V"},{"symbol":"Lσ","meaning":"换流回路寄生电感","unit":"H"},{"symbol":"I","meaning":"下降电流","unit":"A"},{"symbol":"tfi","meaning":"电流下降时长","unit":"s"}],"substitution":"原片1.6Ω独立路径：10nH×25A/5.714ns≈43.75V；50V母线约93.75V峰值。","explanation":"把同一电流更快切断，相当于更大的di/dt。","conditions":"10nH为假设；固定平台和电荷只是一阶近似，振铃与钳位未全计入。"},"sources":[{"title":"TI Fundamentals of MOSFET and IGBT Gate Driver Circuits, SLUA618A","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"},{"title":"Infineon EiceDRIVER Gate resistor for power devices, AN2015-06","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-eicedriver-gate-resistor-for-power-devices-applicationnotes-en.pdf"}],"visual":{"kind":"ringing","labels":["50V母线","43.75V过冲","峰值"],"values":{"bus_V":50,"inductance_nH":10,"current_A":25,"fall_ns":5.714285714285714,"overshoot_V":43.75,"peak_V":93.75,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["K4"],"sourceSummary":"从10nC电流下降电荷得到di/dt，再以10nH算关断过冲，采用80V目标。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"gate-lower-bound","title":"Roff至少2.7Ω是怎样来的？","pitfall":"把某个电阻下限抄给所有100V器件。","steps":["原片先为50V母线选定80V峰值目标。","留给电感过冲的空间只有30V。","在既定电荷、电流和电感模型中反推外部关断阻值。"],"takeaway":"2.7Ω跟全部假设绑定，80V也不是通用80%规则。","formula":{"expression":"Roff,ext≥Lσ I Vpl/[ΔQ(Vlimit−Vbus)]−Rg,int","variables":[{"symbol":"Roff,ext","meaning":"独立有效关断路径外阻","unit":"Ω"},{"symbol":"Lσ","meaning":"回路电感","unit":"H"},{"symbol":"I","meaning":"负载电流","unit":"A"},{"symbol":"Vpl","meaning":"平台电压","unit":"V"},{"symbol":"ΔQ","meaning":"电流下降区电荷","unit":"C"},{"symbol":"Vlimit,Vbus","meaning":"峰值目标与母线","unit":"V"},{"symbol":"Rg,int","meaning":"内部栅阻","unit":"Ω"}],"substitution":"原片：105/(80−50)−0.8=2.7Ω。","explanation":"允许过冲越小，模型要求关得越慢。","conditions":"独立路径、固定平台近似；改变拓扑或驱动内阻需重算。"},"sources":[{"title":"Infineon EiceDRIVER Gate resistor for power devices, AN2015-06","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-eicedriver-gate-resistor-for-power-devices-applicationnotes-en.pdf"}],"visual":{"kind":"gate","labels":["过冲预算","关断速度","候选阻值"],"values":{"bus_V":50,"target_V":80,"L_nH":10,"current_A":25,"plateau_V":4.2,"charge_nC":10,"internal_ohm":0.8,"lowerExternal_ohm":2.7,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["K4"],"sourceSummary":"从10nC电流下降电荷得到di/dt，再以10nH算关断过冲，采用80V目标。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"gate-miller-ratio","title":"Roff/Ron小于0.41能保证不误导通吗？","pitfall":"把简化筛查式当成必要充分条件。","steps":["对管开通速度决定一部分耦合强度。","本管关断路径越强，通常越容易泄走耦合电荷。","用热态本地VGS和电流验证，不能只比较一个比值。"],"takeaway":"0.41只属于这组假设，满足它也不免除实测。","formula":{"expression":"Roff,total/Ron,total<Vth/(Vdrv−Vpl)","variables":[{"symbol":"Roff,total,Ron,total","meaning":"实际关断与开通总阻值","unit":"Ω"},{"symbol":"Vth","meaning":"筛查采用阈值","unit":"V"},{"symbol":"Vdrv","meaning":"开通电压","unit":"V"},{"symbol":"Vpl","meaning":"平台电压","unit":"V"}],"substitution":"原片：2.4/(10−4.2)≈0.414。","explanation":"这是把耦合与泄流作简化比较的筛查。","conditions":"假定相近器件电荷，忽略Cgs分流、时长、偏压与源极反馈；阈值也随条件变化。"},"sources":[{"title":"Infineon ISC019N10NM8SC datasheet, Rev.1.0, 2025-12-12","url":"https://www.infineon.com/assets/row/public/documents/24/49/infineon-isc019n10nm8sc-datasheet-en.pdf"},{"title":"Infineon Designing with power MOSFETs, V1.1","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-designing-with-power-mosfets-applicationnotes-en.pdf?fileId=8ac78c8c7ddc01d7017e6c619a490f47"}],"visual":{"kind":"gate","labels":["耦合进入","泄流返回","筛查线"],"values":{"threshold_V":2.4,"drive_V":10,"plateau_V":4.2,"ratioLimit":0.41379310344827586,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_corrected","sourcePointIds":["K5"],"sourceSummary":"展示对管开通经Cgd把本管栅压抬高，提出总关断/开通电阻比小于0.41。","addedOrCorrected":"不把对称阻值直接等同必然误导通。"}},{"id":"gate-qrr","title":"开通变快，能把Qrr按速度直接放大吗？","pitfall":"拿两档数据表测试就外推任意速度的恢复电荷。","steps":["先确认当前开通电流上升速度。","对比数据表的电流、温度、di/dt与导通历史。","条件不一致时，用合适模型或目标条件测试。"],"takeaway":"恢复电荷依赖工况，不能只凭两个点保证外推值。","formula":{"expression":"di/dt≈I/tri","variables":[{"symbol":"di/dt","meaning":"电流上升速度","unit":"A/s"},{"symbol":"I","meaning":"电流变化量","unit":"A"},{"symbol":"tri","meaning":"上升时长","unit":"s"}],"substitution":"原片模型10Ω外阻：25A/18.62ns≈1.34A/ns=1340A/µs。","explanation":"相同电流在更短时间变化，速度就更高。","conditions":"数据表100/1000A/µs不等于1340或6040A/µs；恢复还受温度和正向电流影响。"},"sources":[{"title":"Infineon ISC019N10NM8SC datasheet, Rev.1.0, 2025-12-12","url":"https://www.infineon.com/assets/row/public/documents/24/49/infineon-isc019n10nm8sc-datasheet-en.pdf"},{"title":"TI Fundamentals of MOSFET and IGBT Gate Driver Circuits, SLUA618A","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"}],"visual":{"kind":"ringing","labels":["换流速度","数据表条件","恢复波形"],"values":{"current_A":25,"rise_ns":18.62,"diDt_A_us":1342.64,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_corrected","sourcePointIds":["K6"],"sourceSummary":"作者先取Ron=10Ω，再由2.7Ω下限及约3.6Ω上限取Roff=3.3Ω，并推荐≥2.5A灌电流。","addedOrCorrected":"保留加快换流会改变恢复的方向，不编造具体Qrr外推。"}},{"id":"gate-parallel-path","title":"图上写3.3Ω，关断真的只经过3.3Ω吗？","pitfall":"忘记常通的10Ω电阻也能反向导电。","steps":["关断时沿电流方向同时追踪两条返回支路。","若10Ω一直连接，二极管加3.3Ω导通后，两条路是并联。","先求实际等效阻抗，再算峰值和驱动能力。"],"takeaway":"必须先修正路径，不能把独立Roff结果套到并联图。","formula":{"expression":"Roff,ext,eq=Ron Rb/(Ron+Rb)","variables":[{"symbol":"Roff,ext,eq","meaning":"外部等效关断阻值","unit":"Ω"},{"symbol":"Ron","meaning":"常通支路阻值","unit":"Ω"},{"symbol":"Rb","meaning":"二极管支路实装阻值","unit":"Ω"}],"substitution":"理想二极管：10Ω∥3.3Ω≈2.481Ω；加0.8Ω内阻后约3.281Ω。","explanation":"电流同时走两条路，合成阻值小于任何一条。","c s":{"peakCurrent_A":2.439,"resistance_ohm":3.3,"instantaneous_W":19.6307793,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_corrected","sourcePointIds":["K7"],"sourceSummary":"作者提示0.38距0.41余量薄，建议米勒钳位或−3～−5V，计算约21mW驱动功率，并要求双脉冲。","addedOrCorrected":"撤掉仅凭平均功率就认定0603足够的结论。"}},{"id":"gate-validate","title":"得到10Ω/3.3Ω候选后还要做什么？","pitfall":"把一阶推导的结果直接当量产值。","steps":["先确认电路真的对应计算的开通和关断路径。","检查驱动能力、尖峰、米勒干扰、恢复和损耗。","在目标板和预期最坏工况验证，再调整阻值或钳位。"],"takeaway":"计算给起点，正确拓扑和实际验证决定最终值。","formula":null,"sources":[{"title":"Infineon EiceDRIVER Gate resistor for power devices, AN2015-06","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-eicedriver-gate-resistor-for-power-devices-applicationnotes-en.pdf"},{"title":"Infineon Gate Driver Parameters Explained","url":"https://www.infineon.com/product-information/gate-driver-parameters-explained"}],"visual":{"kind":"gate","labels":["路径","电压峰值","本地VGS","损耗"],"values":{"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["K8"],"sourceSummary":"按驱动能力、关断尖峰、米勒耦合和开关损耗/Qrr/EMI综合选阻，最后双脉冲；说明为一阶估算且忽略驱动内阻、栅回路电感和电容非线性。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}}]},{"id":"miller","title":"米勒寄生导通：没给开通信号为何仍被抬起","intro":"两条米勒原片的核心内容重复，合为这一套。沿真实顺序解释尖峰、耦合算例及五种措施，并补足器件和动态模型条件。","sourceUrl":"https://www.douyin.com/video/7696211140783767717","sourceWorkId":"7696211140783767717","sourceReview":"reviews/7696211140783767717.json","lessons":[{"id":"MIL-01","title":"命令已经关断，为什么栅极仍冒出尖峰？","pitfall":"把控制器低电平当成器件端栅源电压必为零。","steps":["原片用同一张示波器图指出：红线关断后，对侧开通时又出现尖峰。","控制命令与器件本地VGS是不同的观察量。","应同时看命令、VGS、开关节点和电流。","这张图缺少原始数据和完整探头说明，不能单凭它证实具体炸管原因。"],"takeaway":"先验证实际VGS，再判断是否有明显交叉导通。","formula":null,"sources":[{"title":"The parasitic turn-on behavior of discrete CoolSiC MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-bodos-parasitic-turn-on-article-en.pdf"},{"title":"SLUA618A — Fundamentals of MOSFET and IGBT Gate Driver Circuits","url":"https://www.ti.com/lit/pdf/slua618"}],"visual":{"kind":"miller","labels":["命令关断","实际 VGS","对侧边沿","电流须验证"],"values":{"mode":"symptom","qualitative":true}},"sourceKnowledgePointIds":["MIL01"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"MIL-02","title":"栅极有绝缘层，Cgd 还怎么传来干扰？","pitfall":"把绝缘理解成不可能有电容耦合，或以为电子必须穿过栅氧。","steps":["栅极和漏极之间存在寄生电容Cgd。","漏栅电位差变化时，会产生位移电流。","这一电流可改变栅极储存的电荷，也可由下拉通路吸收。","正常开通的米勒平台和关断时被动尖峰都涉及Cgd，但不是同一事件。"],"takeaway":"绝缘不等于没有电容耦合。","formula":null,"sources":[{"title":"SLUA618A — Fundamentals of MOSFET and IGBT Gate Driver Circuits","url":"https://www.ti.com/lit/pdf/slua618"},{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"}],"visual":{"kind":"miller","labels":["Cgd","位移电流","栅极储荷","驱动下拉"],"values":{"mode":"coupling","qualitative":true}},"sourceKnowledgePointIds":["MIL02"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"MIL-03","title":"10 pF 为什么能产生 0.5 A？","pitfall":"只看电容很小，忽略纳秒级电压边沿。","steps":["先读边沿斜率50V/ns，不能用开关频率替代。","把10pF与50V/ns换成基本单位相乘。","得到0.5A瞬时耦合电流，接着要看它走哪条路径。"],"takeaway":"小电容配上快边沿，也能产生明显电流。","formula":{"expression":"i_M ≈ Cgd · dVDS/dt","variables":[{"symbol":"i_M","meaning":"流入栅极回路的米勒位移电流","unit":"A"},{"symbol":"Cgd","meaning":"当前偏压附近的栅漏微分电容","unit":"F"},{"symbol":"dVDS/dt","meaning":"受扰管漏源电压上升斜率","unit":"V/s"}],"substitution":"10 pF × 50 V/ns = (10×10⁻¹² F) × (50×10⁹ V/s) = 0.5 A","explanation":"这解释了很小的电容也能在极快边沿中产生明显瞬时电流。算术正确，0.5A不是平均栅驱电流。","conditions":["实际电容电压为Vd−Vg；线性电容的精确式为i=Cgd·d(Vd−Vg)/dt。栅压变化较小才近似用dVDS/dt。","Cgd随偏压变化，400V全过程不能一般化当成恒定10pF。","电流方向随边沿方向改变；这节只分析低侧漏压正向上升。"],"origin":"原片公式，核查补充条件"},"sources":[{"title":"The parasitic turn-on behavior of discrete CoolSiC MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-bodos-parasitic-turn-on-article-en.pdf"},{"title":"SLUA618A — Fundamentals of MOSFET and IGBT Gate Driver Circuits","url":"https://www.ti.com/lit/pdf/slua618"},{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"}],"visual":{"kind":"miller","labels":["i_M","Cgd","dVDS/dt"],"values":{"mode":"current","example_only":true,"Cgd_pF":10,"slope_V_ns":50,"Roff_ohm":5,"Miller_current_A":0.5,"resistive_bump_V":2.5}},"sourceKnowledgePointIds":["MIL03"],"contentOrigin":"原片公式，核查补充条件"},{"id":"MIL-04","title":"0.5 A 为什么可能把栅极抬高约 2.5 V？","pitfall":"把5Ω外部电阻当成全部阻抗，并把估算当实测峰值。","steps":["关断驱动具有有限下拉阻抗。","先按总阻抗5Ω和米勒电流0.5A估算压降。","得到2.5V后，还要检查电容分流、驱动非线性和回路电感。"],"takeaway":"2.5V是电阻主导的量级估算。","formula":{"expression":"ΔVGS ≈ i_M · Roff,total","variables":[{"symbol":"ΔVGS","meaning":"相对关断基线的栅源电压抬升","unit":"V"},{"symbol":"i_M","meaning":"近似流过关断电阻通路的电流","unit":"A"},{"symbol":"Roff,total","meaning":"外部关断电阻、驱动吸收阻抗和内栅阻的有效总和","unit":"Ω"}],"substitution":"0.5 A × 5 Ω = 2.5 V；若关断基线为0V，这一近似给出VGS≈2.5V。","explanation":"先算耦合电流，再看泄放通路上形成多少电压。片中5Ω不应被自动解释为只有一只外部电阻。","conditions":["电阻主导且电流已近似建立的估算；有限边沿时，部分电流也在充栅源电容。","驱动器吸收阻抗可能非线性并随温度变化。","忽略栅极电感、共源电感、源极弹跳与振铃，不能作为实际峰值或安全证明。"],"origin":"原片公式，核查补充条件"},"sources":[{"title":"The parasitic turn-on behavior of discrete CoolSiC MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-bodos-parasitic-turn-on-article-en.pdf"},{"title":"SLUA618A — Fundamentals of MOSFET and IGBT Gate Driver Circuits","url":"https://www.ti.com/lit/pdf/slua618"}],"visual":{"kind":"miller","labels":["ΔVGS","i_M","Roff,total"],"values":{"mode":"resistive-bump","example_only":true,"Cgd_pF":10,"slope_V_ns":50,"Roff_ohm":5,"Miller_current_A":0.5,"resistive_bump_V":2.5}},"sourceKnowledgePointIds":["MIL04"],"contentOrigin":"原片公式，核查补充条件"},{"id":"MIL-05","title":"尖峰超过 Vth，就等于完全开通吗？","pitfall":"把典型门限当成全温度保证值，也把它误当额定大电流所需栅压。","steps":["Vth是在指定小电流和电压条件下测出的门限。","原片用SiC约2–3V、GaN约1–2V说明余量小，不能视为全部器件保证范围。","高温可能让门限降低，应核查具体器件最小值。","是否出现破坏性电流还要看转移特性、尖峰时长和回路。"],"takeaway":"越过门限是风险信号，不能单凭它推算损坏。","formula":null,"sources":[{"title":"The parasitic turn-on behavior of discrete CoolSiC MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-bodos-parasitic-turn-on-article-en.pdf"},{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"},{"title":"EPC2304 eGaN FET datasheet","url":"https://www.epc-co.com/epc/Portals/0/epc/documents/datasheets/EPC2304_datasheet.pdf"}],"visual":{"kind":"miller","labels":["Vth 有测试条件","热态最小值","VGS 尖峰","电流仍须核对"],"values":{"mode":"threshold","qualitative":true}},"sourceKnowledgePointIds":["MIL05"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"MIL-06","title":"为什么加长死区不能单独解决米勒尖峰？","pitfall":"把防命令重叠和防寄生导通当作同一个问题。","steps":["死区让上下管命令之间留出关断时间。","片内尖峰发生在死区之后，对侧开通带来dv/dt时。","推迟对侧边沿，耦合事件仍可能跟着发生。","保留合理死区，同时检查耦合、下拉和余量。"],"takeaway":"死区管时序，寄生抬升还需要另一组措施。","formula":null,"sources":[{"title":"The parasitic turn-on behavior of discrete CoolSiC MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-bodos-parasitic-turn-on-article-en.pdf"},{"title":"UCC21750 datasheet — Internal Active Miller Clamp","url":"https://www.ti.com/lit/ds/symlink/ucc21750.pdf"}],"visual":{"kind":"miller","labels":["下管命令","上管命令","死区","对侧边沿后的尖峰"],"values":{"mode":"deadtime","qualitative":true}},"sourceKnowledgePointIds":["MIL06"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"MIL-07","title":"负压关断怎样增加余量？","pitfall":"认为负得越多越好，直接照搬−3至−5V等范围。","steps":["负偏置先把栅压起点降低。","同样2.5V抬升叠在−4V上，算术示意为−1.5V。","先查具体器件推荐值和最大负栅压，再测含振铃的最差值。","有些SiC可以0V关断，不能把此范围推广到所有GaN或IGBT。"],"takeaway":"负偏置是有器件条件的选择，不是统一设置。","formula":{"expression":"VGS,peak ≈ Voff + ΔVGS","variables":[{"symbol":"VGS,peak","meaning":"绝对栅源尖峰估计值","unit":"V"},{"symbol":"Voff","meaning":"驱动关断电压相对本地源极","unit":"V"},{"symbol":"ΔVGS","meaning":"耦合造成的正向抬升","unit":"V"}],"substitution":"用片中−4V基线与2.5V抬升作算术示意：−4+2.5=−1.5V；0V基线时为2.5V。","explanation":"负偏置增加距正向阈值的余量，而非消除耦合电流。","conditions":["并不是建议用户统一使用−4V；必须遵守具体器件推荐值、直流/瞬态负栅压极限和可靠性要求。","真实改变偏置后Cgd、驱动阻抗及尖峰可能变化，不保证相同2.5V增量。","原片SiC−3至−5V、IGBT−5至−15V只能视作部分设计范围；不得推广到全部SiC、IGBT或GaN。"],"origin":"原片负偏置示意，审阅补充算术与限制"},"sources":[{"title":"The parasitic turn-on behavior of discrete CoolSiC MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-bodos-parasitic-turn-on-article-en.pdf"},{"title":"EPC2304 eGaN FET datasheet","url":"https://www.epc-co.com/epc/Portals/0/epc/documents/datasheets/EPC2304_datasheet.pdf"}],"visual":{"kind":"miller","labels":["VGS,peak","Voff","ΔVGS"],"values":{"mode":"negative-bias","example_only":true,"Cgd_pF":10,"slope_V_ns":50,"Roff_ohm":5,"Miller_current_A":0.5,"resistive_bump_V":2.5,"Voff_V":[0,-4],"Vgs_peak_V":[2.5,-1.5],"not_recommended_setting":true}},"sourceKnowledgePointIds":["MIL07"],"contentOrigin":"原片负偏置示意，审阅补充算术与限制"},{"id":"MIL-08","title":"有米勒钳位功能，为什么还可能压不住？","pitfall":"以为驱动器写有钳位，就等于栅极被理想短接。","steps":["关断后满足触发条件，钳位为栅极提供一条低阻吸收路径。","它绕开外部栅阻，但仍有有限吸收电流和连接阻抗。","尽量靠近功率器件，并检查回路电感。","触发电平和时序以具体驱动器为准，不能在开通时短接栅极。"],"takeaway":"钳位要同时满足状态、能力和布局条件。","formula":null,"sources":[{"title":"UCC21750 datasheet — Internal Active Miller Clamp","url":"https://www.ti.com/lit/ds/symlink/ucc21750.pdf"},{"title":"SBAA697 — dV/dt induced turn-on and Miller clamp","url":"https://www.ti.com/document-viewer/lit/html/SBAA697/GUID-851A9A55-824B-47E5-9765-4F9D7AEC8BF4"}],"visual":{"kind":"miller","labels":["关断允许","钳位支路","短低阻路径","有限吸收能力"],"values":{"mode":"clamp","qualitative":true}},"sourceKnowledgePointIds":["MIL08"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"MIL-09","title":"开通和关断栅阻应该分别调哪一侧？","pitfall":"只背开通大、关断小，没有区分对侧管与受扰管。","steps":["对侧管的开通速度决定本次干扰边沿有多陡。","受扰管的关断通路决定耦合电流多容易泄放。","分离Rg,on和Rg,off有利于分别调整这两项。","调慢会增加开关损耗，过小电阻也须检查振铃、过冲和驱动电流。"],"takeaway":"一个减少注入，一个改善泄放；两者都要实测权衡。","formula":null,"sources":[{"title":"The parasitic turn-on behavior of discrete CoolSiC MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-bodos-parasitic-turn-on-article-en.pdf"},{"title":"SLUA618A — Fundamentals of MOSFET and IGBT Gate Driver Circuits","url":"https://www.ti.com/lit/pdf/slua618"},{"title":"SBAA697 — dV/dt induced turn-on and Miller clamp","url":"https://www.ti.com/document-viewer/lit/html/SBAA697/GUID-851A9A55-824B-47E5-9765-4F9D7AEC8BF4"}],"visual":{"kind":"miller","labels":["对侧 Rg,on","受扰侧 Rg,off","dv/dt","VGS 抬升"],"values":{"mode":"split-resistor","qualitative":true}},"sourceKnowledgePointIds":["MIL09"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"MIL-10","title":"加栅源电容为什么能减小快速尖峰？","pitfall":"只算外加电容而遗漏内建Cgs，或把分压式当成任何情况下的通式。","steps":["先区分内建Cgs,int和外加Cext。","在来不及经电阻泄放的快边沿极限下，耦合电荷分给更大总电容。","比较相同输入跃变时的栅压增量。","这是增量，还须加关断基线；真实电容有偏压非线性。"],"takeaway":"电容分压和iR估算属于不同动态极限。","formula":{"expression":"ΔVGS ≈ ΔVDS · Cgd/(Cgd + Cgs,int + Cext)","variables":[{"symbol":"ΔVGS","meaning":"相对初始栅压的抬升","unit":"V"},{"symbol":"ΔVDS","meaning":"漏极电压跃变量","unit":"V"},{"symbol":"Cgd","meaning":"线性化栅漏电容","unit":"F"},{"symbol":"Cgs,int","meaning":"器件自身栅源电容","unit":"F"},{"symbol":"Cext","meaning":"额外并联栅源电容","unit":"F"}],"substitution":"审阅示意：ΔVDS=400V，Cgd=10pF，Cgs,int=990pF。Cext=0时为4V；Cext=1000pF时为2V。此算例并非作者原算例。","explanation":"相同注入电荷分给更大的总电容，电压增量减小。片中把外加电容直接写Cgs，制作时应区分内建和外加。","conditions":["这是快边沿、栅极来不及经电阻泄放的线性电容分压极限；不是含驱动电阻的任意工况通式。","所算是ΔVGS；带负偏置时绝对峰值还要加Voff。","真实Cgd偏压非线性，新增电容会增加驱动电荷与充放电负担。","这一4V/2V例与片中5Ω产生2.5V的电阻主导例属于不同极限，不得当作相互矛盾的同一仿真结果。"],"origin":"原片公式，核查纠正变量与适用边界"},"sources":[{"title":"SLUA618A — Fundamentals of MOSFET and IGBT Gate Driver Circuits","url":"https://www.ti.com/lit/pdf/slua618"},{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"}],"visual":{"kind":"miller","labels":["ΔVGS","ΔVDS","Cgd","Cgs,int","Cext"],"values":{"mode":"capacitive-divider","example_only":true,"Cgd_pF":10,"slope_V_ns":50,"Roff_ohm":5,"Miller_current_A":0.5,"resistive_bump_V":2.5,"Cgs_internal_pF":990,"Cext_pF":[0,1000],"Vds_step_V":400,"bump_V":[4,2],"limit":"fast-edge"}},"sourceKnowledgePointIds":["MIL10"],"contentOrigin":"原片公式，核查纠正变量与适用边界"},{"id":"MIL-11","title":"外加电容为什么不能无限加大？","pitfall":"只看尖峰变小，不计算正常驱动新增的充放电负担。","steps":["增加电容后，每次正常开通也要为它充电。","按电容乘门压摆幅计算额外电荷。","额外电荷占用驱动电流和时间，可能增加开关损耗。"],"takeaway":"抑制尖峰需要与驱动能力和开关速度一起权衡。","formula":{"expression":"ΔQext=Cext·(Von−Voff)","variables":[{"symbol":"ΔQext","meaning":"外加线性电容每次从关断充到开通所增加的电荷","unit":"C"},{"symbol":"Cext","meaning":"外加栅源电容","unit":"F"},{"symbol":"Von","meaning":"开通栅压","unit":"V"},{"symbol":"Voff","meaning":"关断栅压","unit":"V"}],"substitution":"审阅示意：Cext=1nF、Von=15V、Voff=0V，则ΔQext=15nC；若平均充电电流为0.5A，仅这部分电荷就需30ns。","explanation":"增加栅源电容能减小尖峰，同时会占用更多驱动电流与时间。","conditions":["这是外加线性电容的额外电荷，不是整个器件Qg或准确新增开关延时。","驱动电流随栅压变化；30ns只在0.5A恒流假设下成立。"],"origin":"核查补充，原片未展开"},"sources":[{"title":"SLUA618A — Fundamentals of MOSFET and IGBT Gate Driver Circuits","url":"https://www.ti.com/lit/pdf/slua618"},{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"}],"visual":{"kind":"miller","labels":["ΔQext","Cext","Von","Voff"],"values":{"mode":"added-charge","example_only":true,"Cgd_pF":10,"slope_V_ns":50,"Roff_ohm":5,"Miller_current_A":0.5,"resistive_bump_V":2.5,"Cext_pF":1000,"Von_V":15,"Voff_V":0,"extra_Q_nC":15}},"sourceKnowledgePointIds":["MIL10"],"contentOrigin":"核查补充，原片未展开"},{"id":"MIL-12","title":"iR 公式和电容分压为什么给出不同数？","pitfall":"把两种极限估算都当成同一个电路的精确峰值。","steps":["把门端想成同时有储荷电容和泄放电阻。","快速边沿先以储荷为主，较慢边沿更接近电阻泄放。","用简单RC模型可以连接两个极限。","这里约2V的计算是核查演示，不能当作具体器件预测。"],"takeaway":"先说清时间尺度，再选择公式。","formula":{"expression":"ΔVg(tr)=Roff·Cgd·S·[1−exp(−tr/(Roff·CΣ))]","variables":[{"symbol":"ΔVg(tr)","meaning":"恒斜率边沿结束时的栅压增量","unit":"V"},{"symbol":"Roff","meaning":"线性总下拉电阻","unit":"Ω"},{"symbol":"Cgd","meaning":"常数线性化栅漏电容","unit":"F"},{"symbol":"S","meaning":"恒定漏压斜率","unit":"V/s"},{"symbol":"tr","meaning":"边沿持续时间","unit":"s"},{"symbol":"CΣ","meaning":"Cgs,int+Cext+Cgd","unit":"F"}],"substitution":"审阅示意：Roff=5Ω，Cgd=10pF，CΣ=1nF，S=50V/ns，tr=400V/(50V/ns)=8ns。τ=5ns；ΔVg=2.5×(1−e⁻¹·⁶)≈2.00V。","explanation":"从CΣ·dΔVg/dt+ΔVg/Roff=Cgd·S及初值ΔVg(0)=0得到，连接“电阻泄放”和“电容分压”两个极限。","conditions":["这是审阅自行推导的简化线性RC模型，不是原片测量结果。","固定源极、恒定电容/电阻、理想驱动关断基线，不含电感、非线性沟道电流。","tr远大于RC时趋近iR；tr远小于RC时趋近ΔVDS·Cgd/CΣ。","用途是解释不同公式条件，不用于从这组示意数断定真实器件安全。"],"origin":"核查补充推导，原片未出现"},"sources":[{"title":"SLUA618A — Fundamentals of MOSFET and IGBT Gate Driver Circuits","url":"https://www.ti.com/lit/pdf/slua618"},{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"}],"visual":{"kind":"miller","labels":["ΔVg(tr)","Roff","Cgd","S","tr","CΣ"],"values":{"mode":"rc-response","example_only":true,"Cgd_pF":10,"slope_V_ns":50,"Roff_ohm":5,"Miller_current_A":0.5,"resistive_bump_V":2.5,"Csum_pF":1000,"rise_ns":8,"tau_ns":5,"bump_V":1.995258705,"limit":"linear-RC","advanced":true}},"sourceKnowledgePointIds":["MIL04","MIL10"],"contentOrigin":"核查补充推导，原片未出现"},{"id":"MIL-13","title":"驱动器放近了，为什么还要看回流线？","pitfall":"只缩短去栅极的线，忽略源极返回驱动器的路径。","steps":["从驱动输出沿栅线走到器件，再沿源极参考回到驱动器。","这整圈才是栅极电流回路。","去线与回线贴近、闭环紧凑，才有助于降低寄生电感。","VGS测量也应以正确的本地源极为参考。"],"takeaway":"缩小的是完整闭环，不是一根单线。","formula":null,"sources":[{"title":"SLUA618A — Fundamentals of MOSFET and IGBT Gate Driver Circuits","url":"https://www.ti.com/lit/pdf/slua618"},{"title":"SBAA697 — dV/dt induced turn-on and Miller clamp","url":"https://www.ti.com/document-viewer/lit/html/SBAA697/GUID-851A9A55-824B-47E5-9765-4F9D7AEC8BF4"}],"visual":{"kind":"miller","labels":["栅线","本地源极回线","闭合回路","寄生电感"],"values":{"mode":"layout","qualitative":true}},"sourceKnowledgePointIds":["MIL11"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"MIL-14","title":"Crss/Ciss 小，就一定不会误导通吗？","pitfall":"跨不同偏压比较电容单点，拿一个比值作整机结论。","steps":["Crss对应Cgd，Ciss由内建Cgs与Cgd相加。","示意10pF除以1000pF，比值是1%。","比较时匹配VDS、VGS、频率和温度条件。","再结合热态门限、驱动下拉和布局验证实际半桥。"],"takeaway":"比值是筛选线索，不是安全充分条件。","formula":{"expression":"rC = Crss/Ciss","variables":[{"symbol":"rC","meaning":"同条件电容比","unit":"1"},{"symbol":"Crss","meaning":"反向传输电容，对应Cgd","unit":" 流从哪里来？","pitfall":"只要出现40ns间隔，就以为已经留够时间。","steps":["把后开管的上升沿提前，观察它是否撞上前关管。","若两个通道重叠，母线会经两管流过额外电流。","尖峰大小由电源、器件、电阻和寄生电感共同决定。"],"takeaway":"先消除重叠，不能把片中180A当所有电路的结果。","formula":null,"sources":[{"title":"Dead Time — PWM documentation","url":"https://onlinedocs.microchip.com/oxy/GUID-3AFF556D-77AD-488F-9A04-CD7AAB8F7DBC-en-US-1/GUID-1455C45F-0E96-4287-8DF1-2B6235F13BB3.html"},{"title":"Dead time calculation for Insulated Gate Bipolar Transistors (IGBT)","url":"https://community.infineon.com/t5/Knowledge-Base-Articles/Dead-time-calculation-for-Insulated-Gate-Bipolar-Transistors-IGBT/ta-p/434308"}],"visual":{"kind":"deadtime","labels":["前关未结束","后开已开始","重叠风险"],"values":{"commandExample_ns":40,"sourceCurrentExample_A":180,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。","电流柱只标示意，不按40ns自动输出180A。"]},"origin":{"type":"source_corrected","sourcePointIds":["DT03"],"sourceSummary":"40ns控制死区使下管开通早于上管完成关断，红色重叠区对应上管约180A尖峰，正常负载标30A。","addedOrCorrected":"180A仅为原片示意，不从40ns唯一推出。"}},{"id":"deadtime-diode","title":"上下管都关了，电感电流走哪里？","pitfall":"认为关断空隙里没有电流。","steps":["电感电流不能突然归零，会寻找允许的续流路径。","按图示正向负载电流，下管体二极管可能导通，把SW钳到地以下。","电流反向时，续流路径与钳位方向也要反过来检查。"],"takeaway":"两管都关不等于零电流，先看电流方向再找二极管。","formula":null,"sources":[{"title":"Power Loss Calculation With Common Source Inductance Consideration for Synchronous Buck Converters","url":"https://www.ti.com/lit/an/slpa009a/slpa009a.pdf"},{"title":"MCAF 5.5 Dead-time Compensation","url":"https://microchiptech.github.io/mcaf-doc/6.0.2/algorithms/dead-time-comp.html"}],"visual":{"kind":"deadtime","labels":["正向电流","下管二极管","SW负钳位"],"values":{"exampleDiodeDrop_V":0.8,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["DT04"],"sourceSummary":"在示意正相电流下，两管关闭时下管二极管导通；SW被钳在约−0.8V。150ns与1µs设定对应约0.1µs和0.9µs的二极管段。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"deadtime-loss","title":"死区多出来的时间怎样变成热？","pitfall":"把控制器设定的死区直接当每次实际二极管导通时间。","steps":["量出每周期两次二极管实际导通时长。","分别用压降乘电流再乘持续时间，得到每次能量。","把两次能量相加并乘开关频率，得到平均发热。"],"takeaway":"用实际导通时间算损耗，别混用设定死区。","formula":{"expression":"Pdiode≈fsw(VF1|I1|tD1+VF2|I2|tD2)","variables":[{"symbol":"Pdiode","meaning":"二极管导通平均损耗","unit":"W"},{"symbol":"fsw","meaning":"开关频率","unit":"Hz"},{"symbol":"VF1,VF2","meaning":"两次正向压降","unit":"V"},{"symbol":"I1,I2","meaning":"两次换流电流","unit":"A"},{"symbol":"tD1,tD2","meaning":"两次实际导通时长","unit":"s"}],"substitution":"自拟对齐原片波形：两次各100ns、0.8V、30A、20kHz，P≈0.096W。","explanation":"持续时间越长，每秒累计损耗越多。","conditions":"近似恒定电流；这里只算正向损耗，恢复另算。三相电流随时间变化应分别平均。"},"sources":[{"title":"Power Loss Calculation With Common Source Inductance Consideration for Synchronous Buck Converters","url":"https://www.ti.com/lit/an/slpa009a/slpa009a.pdf"},{"title":"MCAF 5.5 Dead-time Compensation","url":"https://microchiptech.github.io/mcaf-doc/6.0.2/algorithms/dead-time-comp.html"}],"visual":{"kind":"deadtime","labels":["实际二极管段","每次能量","每秒次数"],"values":{"tD1_ns":100,"tD2_ns":100,"VF_V":0.8,"current_A":30,"frequency_Hz":20000,"loss_W":0.096,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_corrected","sourcePointIds":["DT05"],"sourceSummary":"视频用两段死区的近似式比较150ns与1µs，得0.14W与0.96W；三相粗算0.43W与2.9W。","addedOrCorrected":"统一实际导通时长；原片设150ns算0.144W与前图100ns不是同一时间口径。"}},{"id":"deadtime-voltage","title":"长死区为什么会影响低速电机电流？","pitfall":"认为死区只影响效率，不影响输出电压。","steps":["死区内输出被续流状态决定，未必等于控制器希望的状态。","电流方向改变时，平均电压误差的方向也可能改变。","低速所需电压较小，同样误差占的比例更大。"],"takeaway":"合理死区与补偿要一起考虑，过零附近需特别验证。","formula":{"expression":"|ΔV|≈Vdc tdead,eff fsw","variables":[{"symbol":"ΔV","meaning":"单桥臂平均电压误差量级","unit":"V"},{"symbol":"Vdc","meaning":"母线电压","unit":"V"},{"symbol":"tdead,eff","meaning":"有效死区","unit":"s"},{"symbol":"fsw","meaning":"开关频率","unit":"Hz"}],"substitution":"原片示例：48V×1µs×20kHz=0.96V。","explanation":"误差量级是母线电压乘每周期丢失的时间比例。","conditions":"连续电流的一阶模型；不是线电压公式，也不能由此独自推出电流8A变3.7A。"},"sources":[{"title":"MCAF 5.5 Dead-time Compensation","ur deadtime","labels":["命令死区","前关完成","后开开始"],"values":{"command_ns":150,"on_ns":20,"off_ns":130,"propOn_ns":30,"propOff_ns":40,"gap_ns":30,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"review_supplement","sourcePointIds":["DT07"],"sourceSummary":"以时间条显示上管最长关断、下管最短开通和驱动延迟偏差；后移开通条消除重叠并留裕量。","addedOrCorrected":"用独立明确变量表达原片时间预算思想。"}},{"id":"deadtime-resistor","title":"更换栅电阻，手册开关时间还能照抄吗？","pitfall":"忽略手册测试阻抗与自己电路的不同。","steps":["先合计该方向的外部、内部与驱动器阻抗。","如果其他条件近似相同，可以用阻抗比估算电荷转换时长。","把固定传播延迟单独处理，最终用目标板确认。"],"takeaway":"阻抗比是初算，不能把典型值放大后称为最坏值。","formula":{"expression":"tnew≈tref Rtotal,new/Rtotal,ref","variables":[{"symbol":"tnew,tref","meaning":"同一定义的转换时间","unit":"s"},{"symbol":"Rtotal,new,Rtotal,ref","meaning":"对应总阻抗","unit":"Ω"}],"substitution":"原片示例：77ns×4.5Ω/3Ω=115.5ns。","explanation":"相同电荷以较小电流充放，所需时间更长。","conditions":"驱动近似电阻且不受限流/电感主导；固定传播延迟不按这个比例缩放。"},"sources":[{"title":"Fundamentals of MOSFET and IGBT Gate Driver Circuits","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"},{"title":"Dead time calculation for Insulated Gate Bipolar Transistors (IGBT)","url":"https://community.infineon.com/t5/Knowledge-Base-Articles/Dead-time-calculation-for-Insulated-Gate-Bipolar-Transistors-IGBT/ta-p/434308"}],"visual":{"kind":"gate","labels":["参考阻抗","实际阻抗","转换时长"],"values":{"reference_ns":77,"reference_ohm":3,"new_ohm":4.5,"estimate_ns":115.5,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["DT08"],"sourceSummary":"示意总栅阻从3Ω改为4.5Ω，对应77ns乘1.5得到约115ns。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"deadtime-corners","title":"最慢关断一定出现在满载吗？","pitfall":"只在室温满载检查一次。","steps":["改变温度会改变阈值、电阻和驱动能力。","改变电流会改变平台和换流状态，轻载也可能出现不利点。","在预期电压、温度、电流方向与负载范围里寻找最坏间隔。"],"takeaway":"最坏工况需要扫描，不能预先规定总是高温轻载。","formula":null,"sources":[{"title":"Fundamentals of MOSFET and IGBT Gate Driver Circuits","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pd
