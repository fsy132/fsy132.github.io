入都可能不同。"],"takeaway":"150ns是演示算术，固定25%余量不能补齐未知边界。","formula":{"expression":"tset≈(toff,max−ton,min+Δtdrv)k","variables":[{"symbol":"tset","meaning":"示例设定死区","unit":"s"},{"symbol":"toff,max","meaning":"最长关断","unit":"s"},{"symbol":"ton,min","meaning":"最短开通","unit":"s"},{"symbol":"Δtdrv","meaning":"不利驱动偏差","unit":"s"},{"symbol":"k","meaning":"示例余量系数","unit":"1"}],"substitution":"原片：(130−20+10)ns×1.25=150ns。","explanation":"先覆盖不利时间差，再按有依据的方式留余量。","conditions":"关断判据必须正确，两个方向都检查；1.25不是通用合格门槛。"},"sources":[{"title":"Dead time calculation for Insulated Gate Bipolar Transistors (IGBT)","url":"https://community.infineon.com/t5/Knowledge-Base-Articles/Dead-time-calculation-for-Insulated-Gate-Bipolar-Transistors-IGBT/ta-p/434308"},{"title":"Power Loss Calculation With Common Source Inductance Consideration for Synchronous Buck Converters","url":"https://www.ti.com/lit/an/slpa009a/slpa009a.pdf"},{"title":"AM13E230X SDK Advanced Features — Dead-Time Compensation","url":"https://software-dl.ti.com/mcu-sdk/esd/AM13E2X-SDK/26_01_00_03/exports/docs/docs/am13e230x/user_guide/chapters/solutions/am13e230x/motor_control/control_advance_features.html"}],"visual":{"kind":"deadtime","labels":["130ns关断","20ns开通","10ns偏差","示例余量"],"values":{"off_ns":130,"on_ns":20,"skew_ns":10,"factor":1.25,"result_ns":150,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["DT11"],"sourceSummary":"逐项把示例最慢关断130ns、最快开通20ns、驱动偏差10ns组合为120ns，乘1.25得150ns，再比较损耗。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"deadtime-measure","title":"示波器上两条边沿错开就能放心吗？","pitfall":"忽略探头延迟、共模能力和实际电流。","steps":["同时看高低侧本地VGS、SW和相关电流。","对齐通道延迟，再识别通道重叠和二极管钳位段。","在不同工况复查，不能只凭典型阈值交点判断零电流。"],"takeaway":"原片结尾是仿真示意，真正验证需要合适的实际测量。","formula":{"expression":"tgap,corrected=tgap,displayed−Δτprobe","variables":[{"symbol":"tgap,corrected","meaning":"校正后的时序差","unit":"s"},{"symbol":"tgap,displayed","meaning":"显示的时序差","unit":"s"},{"symbol":"Δτprobe","meaning":"两通道相对延迟","unit":"s"}],"substitution":"自拟：显示68ns、相对探头延迟8ns，校正后60ns。","explanation":"通道本身的迟到会被误认为电路的间隔。","conditions":"该8ns不是原片已知误差；高边测量需合适共模能力和带宽。"},"sources":[{"title":"OptiMOS Power MOSFET Datasheet Explanation","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-mosfet-optimos-datasheet-explanation-applicationnote-en.pdf"},{"title":"Probing Techniques for Accurate Voltage Measurements on Power Supplies with Oscilloscopes","url":"https://www.tek.com/en/documents/application-note/probing-techniques-accurate-voltage-measurements-power-converters-oscillos"},{"title":"Making Accurate Current Measurements on Power Supplies with Oscilloscopes","url":"https://www.tek.com/en/documents/application-note/making-accurate-current-measurements-power-supplies-oscilloscopes"}],"visual":{"kind":"deadtime","labels":["显示间隔","探头偏差","校正间隔"],"values":{"displayed_ns":68,"relativeDelay_ns":8,"corrected_ns":60,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"review_supplement","sourcePointIds":["DT12"],"sourceSummary":"四路示意波形含高低侧VGS、SW及上管电流；标约68ns阈值交点空隙、约0.1µs二极管段，并要求高温和轻满载检查。","addedOrCorrected":"落实原片测量建议，明确原片曲线并非实测记录。"}}]},{"id":"doublepulse","title":"双脉冲：怎样让开关测试可信","intro":"实际原片围绕48V、100A测试，解释两脉冲、回路寄生和测量误差。以下保留原例，并纠正总电流峰、母线容量及探测条件的简化。","sourceUrl":"https://www.douyin.com/video/7699962228707012992","sourceWorkId":"7699962228707012992","sourceReview":"reviews/7699962228707012992.json","lessons":[{"id":"DPT-01","title":"为什么要用两个短脉冲测开关？","pitfall":"连续开关会改变温度，两个测试平台只比较最终读数可能没有意义。","steps":["先固定母线电压、目标电流和起始温度。","用短时激励建立电流，再单独观察一次关断和一次开通。","短脉冲能减少自热，但仍须核查温升和重复周期。"],"takeaway":"双脉冲是控制测试条件的方法，不能自动保证结温不变。","formula":null,"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"doublepulse","labels":["48 V 母线","100 A 目标","起始温度须记录","短时激励"],"values":{"bus_V":48,"target_A":100,"stage":"overview"}},"sourceKnowledgePointIds":["DPT01"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-02","title":"下管关断后，电感电流去哪了？","pitfall":"把DUT电流归零误画成负载电感电流也归零。","steps":["在原片低侧DUT拓扑里，导通时电流经电感和下管通道。","下管关断后，电感电流改走上侧二极管续流。","所以要分开画负载电流IL和下管电流IDUT。"],"takeaway":"路径改变，电感电流不会在关断瞬间突然消失。","formula":null,"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"doublepulse","labels":["低侧 DUT","上侧二极管","IL","IDUT"],"values":{"bus_V":48,"target_A":100,"stage":"commutation","upper_gate":"off"}},"sourceKnowledgePointIds":["DPT02"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-03","title":"第一和第二脉冲分别测什么？","pitfall":"把两个脉冲当成同一件事的重复，或忽略各事件电流不同。","steps":["第一脉冲先把电流建立到目标值。","原片在第一脉冲末端测关断能量Eoff。","第二脉冲开端测开通能量Eon，并观察续流器件退出导通。","第二脉冲还会继续增流，不能把后一次关断当成同一100A条件。"],"takeaway":"先标清事件窗口，再比较能量与应力。","formula":null,"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"doublepulse","labels":["首脉冲建流","第一次关断 Eoff","间隔续流","第二次开通 Eon"],"values":{"stage":"windows","first_us":41.7,"gap_us":5,"second_us":3}},"sourceKnowledgePointIds":["DPT03"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-04","title":"20 µH 电感多久能从零升到 100 A？","pitfall":"凭习惯设置脉宽，没有把电感和实际电压算进去。","steps":["先把20µH换为20×10⁻⁶H。","用目标电流100A乘电感，再除以电感上的近似48V。","得到约41.7µs后，用实际电流校正脉宽。"],"takeaway":"公式给起算值，实际母线下降和压降会改变斜率。","formula":{"expression":"t₁ ≈ L·I目标 / VL","variables":[{"symbol":"t₁","meaning":"首脉冲时长","unit":"s"},{"symbol":"L","meaning":"负载电感","unit":"H"},{"symbol":"I目标","meaning":"从零建立的电流","unit":"A"},{"symbol":"VL","meaning":"导通时电感有效电压","unit":"V"}],"substitution":"20×10⁻⁶×100÷48 = 41.67×10⁻⁶ s ≈ 41.7 µs","explanation":"电压越高，电流爬升越快；电感越大，爬升越慢。","conditions":["初始电流近似0、L未饱和、母线近似稳定。","实际VL须扣器件压降和线圈电阻影响。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"doublepulse","labels":["20 µH","48 V","100 A","41.7 µs"],"values":{"stage":"build","L_uH":20,"bus_V":48,"target_A":100,"first_us":41.6667}},"sourceKnowledgePointIds":["DPT04"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-05","title":"间隔 5 µs 和第二脉冲 3 µs，电流怎样变？","pitfall":"在续流段仍然用48V算斜率，或以为第二脉冲不再增加电流。","steps":["关断间隔的电感电压由续流压降决定，不再是正48V。","原片下降0.2A隐含约−0.8V有效电感电压。","第二脉冲按48V、3µs、20µH估算，又增加7.2A。","因此本例电流约从100A降到99.8A，再升到107A。"],"takeaway":"每段都用该段的电感电压，带符号计算。","formula":{"expression":"ΔI ≈ VL·Δt / L","variables":[{"symbol":"ΔI","meaning":"该区间电流变化","unit":"A"},{"symbol":"VL","meaning":"按电流方向定义的电感电压","unit":"V"},{"symbol":"Δt","meaning":"区间时长","unit":"s"},{"symbol":"L","meaning":"负载电感","unit":"H"}],"substitution":"间隔：−0.8×5µs÷20µH=−0.2A；第二脉冲：48×3µs÷20µH=+7.2A。","explanation":"同一式分别代入两个区间。−0.8V为根据原片变化量反推的条件，未在原片明确给出。","conditions":["L和每段电压近似不变。","实际续流压降随器件、温度、电流变化。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"doublepulse","labels":["100 A","99.8 A","107 A","分段电压"],"values":{"stage":"segments","L_uH":20,"gap_us":5,"gap_V":-0.8,"second_us":3,"bus_V":48,"currents_A":[100,99.8,107]}},"sourceKnowledgePointIds":["DPT04"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-06","title":"测试电感越大越好吗？","pitfall":"只追求大电感或空气芯，没有核查测试时长、饱和和寄生。","steps":["小电感使第二脉冲中的电流变化更大。","大电感要花更长时间建立同样电流，母线下降和自热也要检查。","选型还要核查峰值电流下的电感量、饱和、铜损和寄生电容。","空气芯可避免磁芯饱和，但它不是所有双脉冲测试的硬性要求。"],"takeaway":"用电流变化、建流时间和真实电感特性一起取舍。","formula":null,"sources":[{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"doublepulse","labels":["较小 L：爬升快","较大 L：时间长","核查峰值电流","检查漏磁耦合"],"values":{"stage":"inductor-choice","qualitative":true}},"sourceKnowledgePointIds":["DPT05"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-07","title":"建立 100 A 要给电感多少能量？","pitfall":"把电感储能当成整个测试序列的全部能耗。","steps":["先算电流的平方：100²=10000。","再乘20µH和二分之一。","结果0.1J是这一电流下的电感储能，还没包括开关和导通损耗。"],"takeaway":"储能只是母线能量预算的一部分。","formula":{"expression":"EL = ½·L·I²","variables":[{"symbol":"EL","meaning":"电感储能","unit":"J"},{"symbol":"L","meaning":"线性电感量","unit":"H"},{"symbol":"I","meaning":"电流","unit":"A"}],"substitution":"½×20×10⁻⁶×100² = 0.1 J","explanation":"电流翻倍，在线性电感模型中储能变四倍。","conditions":["L需在所算电流下近似恒定；饱和时不能直接套常数L。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"energy","labels":["20 µH","100 A","0.1 J","储能，非总损耗"],"values":{"kindDetail":"inductor","L_uH":20,"current_A":100,"energy_J":0.1}},"sourceKnowledgePointIds":["DPT01","DPT05","DPT06"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-08","title":"2.2 mF 能保证整组脉冲只掉 1 V 吗？","pitfall":"把首脉冲0.1J的容量结果当成整组双脉冲的保证。","steps":["原片用48V、允许下降1V和首脉冲0.1J，得到约2.1mF。","若把第二脉冲增加的约0.0149J也算入，总计约0.1149J。","在全部能量来自电容等假设下，同一1V要求需要约2.42mF。","这只是补算示例，实际还须计入电源补能、损耗、容差和ESR。"],"takeaway":"先说明压降要求覆盖哪个时间区间，再算容量。","formula":{"expression":"C ≥ Edraw / (V₀·ΔV − ½·ΔV²)","variables":[{"symbol":"C","meaning":"母线电容","unit":"F"},{"symbol":"Edraw","meaning":"该区间电容净供能","unit":"J"},{"symbol":"V₀","meaning":"起始电压","unit":"V"},{"symbol":"ΔV","meaning":"允许下降","unit":"V"}],"substitution":"首脉冲：0.1÷(48×1−0.5×1²)=2.105mF；全组示例：0.1148896÷47.5≈2.419mF。","explanation":"由电容初末储能差推导；原片小压降近似约2.1mF。","conditions":["全组补算假设首脉冲100A、间隔99.8A、第二脉冲107A，20µH。","用近似48V计算电流，忽略损耗与电源补能，不是最终选型推荐。"],"origin":"原片容量算例，审阅改为精确能量式并补全时间范围"},"sources":[{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"energy","labels":["首脉冲 0.1 J","全组约 0.1149 J","48→47 V","容量须计全序列"],"values":{"kindDetail":"bus-capacitor","V0_V":48,"drop_V":1,"energy_J":[0.1,0.1148896],"cap_mF":[2.105263,2.418728]}},"sourceKnowledgePointIds":["DPT06"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-09","title":"大电解电容已经够多，为什么还要局部去耦？","pitfall":"把大容量等同于快速电流的低阻路径。","steps":["储能电容负责微秒尺度的总能量预算。","快速开关电流还受到电容ESL、ESR及连接路径影响。","让适合的低寄生电容靠近换流回路，减少高频电流绕路。"],"takeaway":"总容量和局部高频回路是两项不同的检查。","formula":null,"sources":[{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"doublepulse","labels":["储能电容","局部低寄生电容","短换流回路","ESR / ESL"],"values":{"stage":"decoupling","qualitative":true}},"sourceKnowledgePointIds":["DPT06","DPT07"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-10","title":"同一器件为何在不同平台出现不同过冲？","pitfall":"把布局电感造成的变化全部归给器件，或把示意107V当成通用雪崩钳位值。","steps":["找到开关瞬间快速变化的换流电流及其闭合回路。","回路电感会对电流变化产生附加电压。","原片4.5/7.5/16.5nH对应70/84/107V，是未提供完整模型的仿真示意。","降低回路寄生后，仍要检查实际器件耐压、振铃和损耗。"],"takeaway":"测试平台是测试条件的一部分，峰值不能脱离回路。","formula":{"expression":"|ΔVL| ≈ Lloop·|di/dt|","variables":[{"symbol":"ΔVL","meaning":"电感附加电压幅值","unit":"V"},{"symbol":"Lloop","meaning":"换流回路等效电感","unit":"H"},{"symbol":"di/dt","meaning":"流经该电感的电流变化率","unit":"A/s"}],"substitution":"审阅示意：10nH×2A/ns = 20V。此例只演示单位，不复算原片70/84/107V。","explanation":"电流方向决定电压符号；这里只展示关断时正向过冲。","conditions":["实际峰值还受电容、阻尼、驱动速度与雪崩影响。","不能以一条公式保证器件安全。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"ringing","labels":["48 V 母线","回路电感","真实过冲","仿真示意"],"values":{"kindDetail":"power-loop","bus_V":48,"L_nH":[4.5,7.5,16.5],"source_peaks_V":[70,84,107],"numeric_status":"原片示意，未复现模型"}},"sourceKnowledgePointIds":["DPT07"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-11","title":"换一下探头地线方向，峰值为何变了？","pitfall":"把测量回路拾取的电压当作全部真实过冲。","steps":["大探测环路可能从附近高di/dt回路拾取电压。","环路方向改变，拾取误差可以相加，也可以相减。","原片参考84V、两种连接102V和71V均为示意；84−71应为13V。","缩短测量回路前，先确认参考地、量程、共模和隔离条件都合适。"],"takeaway":"改善连接可减少测量伪影，但不会自动消除真实器件过冲。","formula":{"expression":"vpickup ≈ ±M·di/dt","variables":[{"symbol":"vpickup","meaning":"磁耦合拾取电压","unit":"V"},{"symbol":"M","meaning":"两回路互感","unit":"H"},{"symbol":"di/dt","meaning":"干扰源电流变化率","unit":"A/s"}],"substitution":"审阅示意：M=1nH、di/dt=2A/ns，可拾取约±2V。","explanation":"正负取决于回路方向；此式只解释一种误差来源。","conditions":["普通接地探头只能用于允许连接示波器保护地的参考点。","高侧或浮动节点须使用额定合适的差分/隔离测量；短地弹簧不能替代这些条件。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"ABCs of Probes Primer","url":"https://www.tek.com/en/documents/whitepaper/abcs-probes-primer"}],"visual":{"kind":"ringing","labels":["参考示意 84 V","长环路 102 V","反向 71 V","小测量环路"],"values":{"kindDetail":"probe-pickup","reference_V":84,"readings_V":[102,71],"qualitative_error":true}},"sourceKnowledgePointIds":["DPT08"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-12","title":"波形越平滑，测量就越准确吗？","pitfall":"用开关频率选择带宽，或把200MHz当所有任务的通用合格线。","steps":["测量链必须保留实际边沿和恢复尖峰，而不只是脉冲重复频率。","原片低带宽滤波把总电流峰122A压到约104A。","同例Eon从21.4µJ变为10.1µJ，少读约53%。","按边沿速度、误差目标和完整探头—示波器链选择带宽。"],"takeaway":"平滑可能只是细节被滤掉，带宽门槛必须带工况。","formula":{"expression":"相对误差 = (读数/参考值 − 1)×100%","variables":[{"symbol":"读数","meaning":"待比较的同一指标","unit":"µJ"},{"symbol":"参考值","meaning":"同条件参考能量","unit":"µJ"},{"symbol":"相对误差","meaning":"比例误差","unit":"%"}],"substitution":"(10.1÷21.4−1)×100%≈−52.8%。","explanation":"这个百分比针对原片Eon示意，不适用于所有低带宽测量。","conditions":["原片20/100/400MHz曲线缺少原始数据和滤波器，无法独立复算精确能量。","同时考虑量程、噪声、共模、插入寄生和连接。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"ABCs of Probes Primer","url":"https://www.tek.com/en/documents/whitepaper/abcs-probes-primer"}],"visual":{"kind":"doublepulse","labels":["参考 21.4 µJ","400 MHz：20.6 µJ","100 MHz：18.3 µJ","20 MHz：10.1 µJ"],"values":{"stage":"bandwidth","bandwidth_MHz":[400,100,20],"Eon_uJ":[20.6,18.3,10.1],"reference_uJ":21.4,"peaks_A":[122,104],"numeric_status":"原片滤波示意"}},"sourceKnowledgePointIds":["DPT09"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-13","title":"几纳秒的测量延迟为什么也会改能量？","pitfall":"直接让真实电压和电流边沿重合，误把器件本来的时序也消掉。","steps":["电压探头与电流探头的测量延迟可能不同。","相乘时错位，重叠面积和能量读数就会改变。","原片±约3ns例得到16.8或27.1µJ，参考21.4µJ。","用合适夹具或有依据的方法校正测量链延迟，保留真实器件时序。"],"takeaway":"校准的是测量误差，不是把所有边沿强行对齐。","formula":null,"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"A New Software Deskew Approach Accelerates Double Pulse Testing","url":"https://www.tek.com/en/blog/a-new-software-deskew-approach-accelerates-double-pulse-testing"}],"visual":{"kind":"doublepulse","labels":["固定 VDS","校准后的 ID","测量偏移 ±3 ns","Eon 随错位改变"],"values":{"stage":"deskew","offset_ns":[-3,0,3],"Eon_uJ":[27.1,21.4,16.8],"numeric_status":"原片示意，准确值不可复算"}},"sourceKnowledgePointIds":["DPT10"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-14","title":"电压和电流怎样变成开关功率？","pitfall":"只看电流峰或者电压峰，就判断开关损耗大小。","steps":["在同一时刻读取器件的漏源电压和漏极电流。","相乘得到该时刻功率，保持正确极性和同一器件参考点。","移动时间光标，就能得到整段功率曲线。"],"takeaway":"功率看同一时刻的V和I，不看两个互不对应的峰值相乘。","formula":{"expression":"p(t) = vDS(t)·iD(t)","variables":[{"symbol":"p(t)","meaning":"器件瞬时功率","unit":"W"},{"symbol":"vDS(t)","meaning":"该时刻漏源电压","unit":"V"},{"symbol":"iD(t)","meaning":"该时刻漏极电流","unit":"A"}],"substitution":"审阅入门示意：同一时刻20V×50A=1000W。","explanation":"功率可能很大但持续很短；能量还要看时间面积。","conditions":["先校准延迟、极性、零位和量程。","这是原片能量读数的解释补充，不是其原始波形的某个已验证采样点。"],"origin":"核查补充：解释原片能量读数"},"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"A New Software Deskew Approach Accelerates Double Pulse Testing","url":"https://www.tek.com/en/blog/a-new-software-deskew-approach-accelerates-double-pulse-testing"}],"visual":{"kind":"energy","labels":["同一时刻 VDS","同一时刻 ID","瞬时功率","示意点 1000 W"],"values":{"kindDetail":"instant-power","voltage_V":20,"current_A":50,"power_W":1000}},"sourceKnowledgePointIds":["DPT03","DPT09","DPT10"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-15","title":"怎样从功率曲线算一次开关的能量？","pitfall":"把瞬时功率或最高峰直接当成能量。","steps":["先选定并记录一次开关事件的积分窗口。","将窗口内功率按时间累加，得到面积。","简单矩形1000W持续20ns时，面积为20µJ。","原片21.4µJ与135µJ需要原始曲线和窗口才能复算。"],"takeaway":"能量是有窗口的功率面积，窗口和校准都是结果的一部分。","formula":{"expression":"Esw = ∫[ta,tb] p(t) dt","variables":[{"symbol":"Esw","meaning":"事件能量","unit":"J"},{"symbol":"p(t)","meaning":"器件瞬时功率","unit":"W"},{"symbol":"ta,tb","meaning":"积分起止时间","unit":"s"}],"substitution":"审阅矩形示意：1000W×20×10⁻⁹s=20×10⁻⁶J=20µJ。","explanation":"真实功率不一定是矩形，应按采样积分或可靠模型求面积。","conditions":["固定事件定义及导通基线处理；不可从峰值直接推断。"],"origin":"核查补充：原片没有展开此积分式"},"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"A New Software Deskew Approach Accelerates Double Pulse Testing","url":"https://www.tek.com/en/blog/a-new-software-deskew-approach-accelerates-double-pulse-testing"}],"visual":{"kind":"energy","labels":["ta","tb","功率面积","J / µJ"],"values":{"kindDetail":"switching-integral","example_power_W":1000,"example_width_ns":20,"example_energy_uJ":20}},"sourceKnowledgePointIds":["DPT03","DPT09","DPT10"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-16","title":"122 A 峰值就是反向恢复电流吗？","pitfall":"把DUT总漏极电流峰直接标成二极管Irr。","steps":["原片总峰约122A，其中已经包含约100A负载电流。","先把总峰与负载基线分开。","差值约22A仍可能含输出电容的位移电流等分量。"],"takeaway":"122A是总峰；仅靠这条曲线不能直接确定纯反向恢复峰。","formula":{"expression":"I额外 ≈ IDUT,peak − IL","variables":[{"symbol":"I额外","meaning":"高于负载基线的总额外电流","unit":"A"},{"symbol":"IDUT,peak","meaning":"DUT总漏极电流峰","unit":"A"},{"symbol":"IL","meaning":"同一时刻负载电流","unit":"A"}],"substitution":"122−100=22A。","explanation":"这里只得到额外部分，不自动等于二极管纯反向恢复电流。","conditions":["仅在其他电容电流等可忽略时，差值才可粗略解释为恢复分量。"],"origin":"原片标签纠正与核查补充"},"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"doublepulse","labels":["负载基线 100 A","DUT 总峰 122 A","额外约 22 A","Irr 须另定义"],"values":{"stage":"recovery-peak","load_A":100,"total_A":122,"extra_A":22}},"sourceKnowledgePointIds":["DPT11"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-17","title":"反向恢复电荷 Qrr 应对哪条电流求面积？","pitfall":"把整个DUT电流包括负载电流一并积分，误称Qrr。","steps":["先确认二极管支路中的反向恢复电流。","按所用标准或数据表定义选择恢复积分区间。","将这一反向电流幅值对时间积分。","若只有DUT总电流，须先分离负载和其他分量。"],"takeaway":"Qrr要有正确电流支路、方向和边界。","formula":{"expression":"Qrr = ∫恢复区间 |ireverse(t)| dt","variables":[{"symbol":"Qrr","meaning":"按规定边界的恢复电荷","unit":"C"},{"symbol":"ireverse(t)","meaning":"二极管反向恢复电流","unit":"A"},{"symbol":"t","meaning":"时间","unit":"s"}],"substitution":"审阅三角形示意：峰20A、底宽50ns，面积½×20×50ns=500nC。","explanation":"这500nC不是作者器件的测量结果，只演示面积。","conditions":["真实恢复曲线不一定三角形，且定义可能包含特定电容电荷分量。"],"origin":"核查补充"},"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"}],"visual":{"kind":"energy","labels":["二极管反向电流","恢复积分区间","示意面积 500 nC","不是总 DUT 面积"],"values":{"kindDetail":"recovery-charge","peak_A":20,"width_ns":50,"charge_nC":500,"example_only":true}},"sourceKnowledgePointIds":["DPT11"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"DPT-18","title":"135 µJ 与 251 µJ 的差距能直接归给器件吗？","pitfall":"把不同平台读数直接当器件差异，或者把各场景误差百分比相加。","steps":["先确认两个值都是Eoff且工况、测量窗口一致。","原片用135与251µJ展示平台差异，约相差86%。","检查功率回路、去耦、电感、探头连接、带宽和延迟校准记录。","原片全部曲线说明为仿真示意；它没有提供可复现两平台的完整模型。"],"takeaway":"保留条件和测量链，才有可比较的结果。","formula":{"expression":"变化率 = (新值/参考值 − 1)×100%","variables":[{"symbol":"新值","meaning":"待比较的Eoff","unit":"µJ"},{"symbol":"参考值","meaning":"参考Eoff","unit":"µJ"},{"symbol":"变化率","meaning":"相对变化","unit":"%"}],"substitution":"(251÷135−1)×100%≈85.9%。","explanation":"开场比较是Eoff；前面带宽和延迟的示例是Eon，不能混加。","conditions":["原片数值为示意，不能当作已校准平台或真实器件性能。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"Double Pulse Test with the Tektronix AFG31000 Arbitrary Function Generator","url":"https://www.tek.com/en/documents/application-note/double-pulse-test-tektronix-afg31000-arbitrary-function-generator"},{"title":"Double Pulse Testing: The How, What and Why","url":"https://www.infineon.com/assets/row/public/documents/60/54/infineon-double-pulse-testing-bodos-power-systems-article-en.pdf"},{"title":"ABCs of Probes Primer","url":"https://www.tek.com/en/documents/whitepaper/abcs-probes-primer"},{"title":"A New Software Deskew Approach Accelerates Double Pulse Testing","url":"https://www.tek.com/en/blog/a-new-software-deskew-approach-accelerates-double-pulse-testing"}],"visual":{"kind":"doublepulse","labels":["Eoff 135 µJ","Eoff 251 µJ","约 +86%","同条件再比较"],"values":{"stage":"comparison","Eoff_uJ":[135,251],"simulation":true}},"sourceKnowledgePointIds":["DPT12"],"contentOrigin":"原片观点，经核查补充条件"}],"reviewStatus":"实际原片画面按2秒间隔抽样，关键帧另行细读；非逐帧连续观看","audio":"不使用原片音轨；本模块无音频。音轨是否含解说未独立听辨，按用户说明以画面为教学内容。","sourceScope":"原片可见知识重述；核查补充均标明，不复制原片美术。"},{"id":"soa","title":"SOA：小电流为何也可能烧管","intro":"实际原片用48V、2200µF缓启动解释额定电流与线性工作差别。以下把平均温度粗估、真实功率轨迹和局部热点边界分开。","sourceUrl":"https://www.douyin.com/video/7696937215700950117","sourceWorkId":"7696937215700950117","sourceReview":"reviews/7696937215700950117.json","lessons":[{"id":"SOA-01","title":"额定约 300 A，为什么不能保证缓启动 10 A 安全？","pitfall":"把首页额定电流当成任何电压、温度和工作状态下的能力。","steps":["原片约297A来自充分导通的热限制估算。","代入最高结温175°C、壳温25°C、热阻0.5K/W和热态电阻3.4mΩ。","结果还要同时满足封装、连接和PCB等其他限制。","缓启动处于较高漏源电压，必须另看线性SOA。"],"takeaway":"额定电流离不开条件，不能替代线性模式检查。","formula":{"expression":"I热 ≈ √[(Tj,max−Tc)/(Rθ,jc·RDS,on)]","variables":[{"symbol":"I热","meaning":"只计导通损耗的芯片热受限电流","unit":"A"},{"symbol":"Tj,max","meaning":"最高结温","unit":"°C"},{"symbol":"Tc","meaning":"壳温或指定安装基温","unit":"°C"},{"symbol":"Rθ,jc","meaning":"结壳热阻","unit":"K/W"},{"symbol":"RDS,on","meaning":"对应热态和栅压的导通电阻","unit":"Ω"}],"substitution":"√[(175−25)/(0.5×0.0034)] ≈ 297A。","explanation":"这是片内假设器件、10V栅压的计算，不是某具体型号验证。","conditions":["稳态、充分导通且只计导通损耗；高温RDS,on条件须匹配。","器件其他限制可能更严格。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"}],"visual":{"kind":"thermal","labels":["175°C 结温上限","25°C 壳温","热态 3.4 mΩ","约 297 A"],"values":{"mode":"rated-current","Tmax_C":175,"Tcase_C":25,"Rth_K_W":0.5,"R_mohm":3.4,"current_A":297.044}},"sourceKnowledgePointIds":["SOA01"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-02","title":"同样 10 A，充分导通时发热多少？","pitfall":"忽略栅压和温度，把毫欧电阻当永远不变的数。","steps":["原片充分导通示例取电阻2mΩ、电流10A。","电流平方乘电阻得到0.2W。","这个2mΩ与上一页175°C时的3.4mΩ不是同一条件下的常数。"],"takeaway":"只有在充分导通且条件匹配时，才用I²R算导通损耗。","formula":{"expression":"Pon ≈ I²·RDS,on","variables":[{"symbol":"Pon","meaning":"导通耗散功率","unit":"W"},{"symbol":"I","meaning":"电流","unit":"A"},{"symbol":"RDS,on","meaning":"当前温度和栅压下导通电阻","unit":"Ω"}],"substitution":"10²×0.002=0.2W。","explanation":"相应漏源压降仅约0.02V。","conditions":["原片没有给2mΩ的明确温度；它是示意参数。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"Linear Mode Operation and Safe Operating Diagram of Power-MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-applicationnote-linear-mode-operation-safe-operation-diagram-mosfets-applicationnotes-en.pdf"},{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"}],"visual":{"kind":"soa","labels":["充分导通","10 A","2 mΩ","0.2 W"],"values":{"mode":"ohmic","current_A":10,"R_mohm":2,"Vds_V":0.02,"power_W":0.2}},"sourceKnowledgePointIds":["SOA02"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-03","title":"同样 10 A，启动瞬间为何变成 480 W？","pitfall":"在限流区仍然用充分导通电阻计算损耗。","steps":["电容刚开始充电时，片内MOS两端约有48V。","它同时流过10A，所以功率为480W。","这是充分导通0.2W示例的2400倍。","输出电压升高后，MOS电压和功率会下降，不会一直保持480W。"],"takeaway":"先看实际VDS和ID，再谈电流是不是“小”。","formula":{"expression":"P = VDS·ID","variables":[{"symbol":"P","meaning":"器件瞬时功率","unit":"W"},{"symbol":"VDS","meaning":"实际漏源电压","unit":"V"},{"symbol":"ID","meaning":"漏极电流","unit":"A"}],"substitution":"48×10=480W；480÷0.2=2400。","explanation":"同一个电流，在不同电压下发热完全不同。","conditions":["这里只是理想恒流启动的起始附近峰值。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"Linear Mode Operation and Safe Operating Diagram of Power-MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-applicationnote-linear-mode-operation-safe-operation-diagram-mosfets-applicationnotes-en.pdf"},{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"}],"visual":{"kind":"soa","labels":["线性限流","48 V","10 A","起始 480 W"],"values":{"mode":"linear","Vds_V":48,"current_A":10,"power_W":480,"reference_power_W":0.2}},"sourceKnowledgePointIds":["SOA02"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-04","title":"瞬态热阻 Zth 表示什么？","pitfall":"把某时刻功率乘同一时间Zth，就当成任意波形的温度。","steps":["Zth描述规定热边界下，从零施加恒功率后的热响应。","先确认是结壳还是结环境、单次还是重复脉冲。","若纵轴是归一化值，要先乘指定稳态热阻。","功率变化时，过去的发热仍会影响现在的温度。"],"takeaway":"P×Zth直接对应恒功率加热段，变功率要处理历史。","formula":{"expression":"Tj(t) = Tc + P₀·Zth,jc(t)","variables":[{"symbol":"Tj","meaning":"模型结温","unit":"°C"},{"symbol":"Tc","meaning":"近似恒定壳温","unit":"°C"},{"symbol":"P₀","meaning":"自零开始施加的恒定功率","unit":"W"},{"symbol":"Zth,jc","meaning":"结壳热阶跃响应","unit":"K/W"},{"symbol":"t","meaning":"加热时间","unit":"s"}],"substitution":"审阅恒功率示意：Tc=80°C，P₀=100W，Zth(10ms)=0.43K/W，则Tj=123°C。","explanation":"100W是为解释公式补充的恒功率例，不是原片实际启动功率。","conditions":["起始热状态和壳温已知，功率恒定。","均匀热模型不自动覆盖局部热点。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"MOSFET Safe Operating Area and Hot Swap Circuits","url":"https://www.analog.com/en/resources/technical-articles/mosfet-safe-operating-area-and-hot-swap-circuits.html"},{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"}],"visual":{"kind":"thermal","labels":["恒功率阶跃","Zth 随时间增长","0.43 K/W 示例","热历史"],"values":{"mode":"thermal-step","power_W":100,"Tcase_C":80,"Zth_K_W":0.43,"Tj_C":123}},"sourceKnowledgePointIds":["SOA03"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-05","title":"48 V、2200 µF、10 A 要充多久？","pitfall":"没有扣除负载电流，或忽略电容初始电压。","steps":["先把2200µF换成0.0022F。","初始为0V且10A全部流入电容时，用C×电压变化÷电流。","得到10.56ms，约为原片10.6ms。","若并联负载也取电，应使用净流入电容的电流。"],"takeaway":"充电时间由电容、电压变化和净充电电流共同决定。","formula":{"expression":"tp = C·(Vf−Vi)/Icharge","variables":[{"symbol":"tp","meaning":"理想恒流充电时长","unit":"s"},{"symbol":"C","meaning":"输出电容","unit":"F"},{"symbol":"Vf","meaning":"最终电压","unit":"V"},{"symbol":"Vi","meaning":"初始电压","unit":"V"},{"symbol":"Icharge","meaning":"净流入电容的电流","unit":"A"}],"substitution":"0.0022×(48−0)÷10=0.01056s=10.56ms。","explanation":"减小电流会把这段时间拉长。","conditions":["电源稳定，电容近似理想，忽略控制过渡。","接近充满时MOS会退出恒流区。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"Linear Mode Operation and Safe Operating Diagram of Power-MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-applicationnote-linear-mode-operation-safe-operation-diagram-mosfets-applicationnotes-en.pdf"},{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"}],"visual":{"kind":"soa","labels":["48 V 输入","2200 µF","净充电 10 A","10.56 ms"],"values":{"mode":"charge-time","Vin_V":48,"C_uF":2200,"current_A":10,"time_ms":10.56}},"sourceKnowledgePointIds":["SOA04"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-06","title":"为什么启动平均功率是 240 W，而不是 480 W？","pitfall":"把起始峰值当成整段恒功率，或者以为功率下降就没有热历史。","steps":["理想恒流充电时，输出电压线性升高。","MOS两端电压从48V下降到接近0V。","因此功率从480W近似线性下降，时间平均为240W。","平均功率可以描述能量，却不自动给出最高结温。"],"takeaway":"先认清功率波形，再选热计算方法。","formula":{"expression":"Pavg = Vin·I/2","variables":[{"symbol":"Pavg","meaning":"理想充电期间平均功率","unit":"W"},{"symbol":"Vin","meaning":"稳定输入电压","unit":"V"},{"symbol":"I","meaning":"无额外负载时的恒定充电电流","unit":"A"}],"substitution":"48×10÷2=240W。","explanation":"该三角功率的高度是480W，底宽约10.56ms。","conditions":["电容从0V充至Vin，净恒流，近似无并联负载和其他损耗。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"}],"visual":{"kind":"thermal","labels":["峰值 480 W","平均 240 W","三角功率","10.56 ms"],"values":{"mode":"triangular-power","peak_W":480,"average_W":240,"width_ms":10.56}},"sourceKnowledgePointIds":["SOA04"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-07","title":"视频里的 183°C 是已经验证的最高结温吗？","pitfall":"把平均功率矩形化粗估当成真实峰值，直接判定某个器件必烧。","steps":["原片假设壳温80°C、平均240W，取0.43K/W。","按平均功率等效后算得183.2°C。","改成3A时，片内用72W和0.49K/W算得115.28°C，约写116°C。","真实最高温度还需匹配波形、器件热模型及SOA；这些数没有被实际器件验证。"],"takeaway":"保留“粗估”身份，不能用它替代完整温度轨迹。","formula":{"expression":"Test ≈ Tc + Pavg·Zth(tp)","variables":[{"symbol":"Test","meaning":"等效矩形粗估指标","unit":"°C"},{"symbol":"Tc","meaning":"假设壳温","unit":"°C"},{"symbol":"Pavg","meaning":"平均功率","unit":"W"},{"symbol":"Zth(tp)","meaning":"所选脉宽处的热阻","unit":"K/W"},{"symbol":"tp","meaning":"完整充电时长","unit":"s"}],"substitution":"10A例：80+240×0.43=183.2°C；3A例：80+72×0.49=115.28°C。","explanation":"两种数值都来自原片的平均法；算术成立不等于实际峰值已知。","conditions":["厂商资料有条件允许非矩形脉冲转换，不能泛化成所有波形等峰温。","未给具体器件、热RC模型及适用SOA区域；热失稳区尤其不能仅靠均匀平均法。"],"origin":"原片粗估，核查明确其边界"},"sources":[{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"},{"title":"MOSFET Safe Operating Area and Hot Swap Circuits","url":"https://www.analog.com/en/resources/technical-articles/mosfet-safe-operating-area-and-hot-swap-circuits.html"}],"visual":{"kind":"thermal","labels":["80°C 壳温","平均法粗估","183.2°C","115.28°C"],"values":{"mode":"rough-estimate","Tcase_C":80,"Pavg_W":[240,72],"Zth_K_W":[0.43,0.49],"temperature_C":[183.2,115.28],"not_verified_peak":true}},"sourceKnowledgePointIds":["SOA05","SOA10"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-08","title":"功率改变后，前一段发热怎样继续算？","pitfall":"每一段都从冷态重算，或把当前功率直接乘从启动到现在的Zth。","steps":["把功率曲线分成若干恒定台阶。","每次变化只记录增加或减少了多少功率。","每个台阶按它已经持续的时间求热响应，再相加。","整段温度曲线都要查看，最大值未必在充电结束时。"],"takeaway":"变功率要保留历史；这一步是核查补充。","formula":{"expression":"ΔTj(t) = Σ ΔPk·Zth(t−tk)","variables":[{"symbol":"ΔTj","meaning":"相对初始热边界的温升","unit":"K"},{"symbol":"ΔPk","meaning":"第k次功率变化量，可正可负","unit":"W"},{"symbol":"tk","meaning":"该次功率变化时刻","unit":"s"},{"symbol":"Zth","meaning":"热阶跃响应","unit":"K/W"},{"symbol":"t","meaning":"当前时刻","unit":"s"}],"substitution":"审阅示意：先10W，1ms后加10W；在2ms时，若Zth(2ms)=0.4、Zth(1ms)=0.2K/W，则温升10×0.4+10×0.2=6K。","explanation":"两段历史分别计算；不是用最后20W一口气乘0.4。","conditions":["线性时不变的均匀等效热模型、边界条件明确。","局部热点、壳温变化及非线性需要更完整模型。"],"origin":"核查补充：原片未讲阶跃叠加"},"sources":[{"title":"MOSFET Safe Operating Area and Hot Swap Circuits","url":"https://www.analog.com/en/resources/technical-articles/mosfet-safe-operating-area-and-hot-swap-circuits.html"}],"visual":{"kind":"thermal","labels":["功率台阶","每段历史","6 K 示意","寻找整个温度峰值"],"values":{"mode":"thermal-history","power_steps_W":[10,10],"step_times_ms":[0,1],"evaluation_ms":2,"Zth_K_W":[0.4,0.2],"rise_K":6,"example_only":true}},"sourceKnowledgePointIds":["SOA05","SOA11"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-09","title":"SOA 图为什么不能只用一条热公式画出来？","pitfall":"只要平均结温不超标，就认为高压下任何电流都安全。","steps":["SOA同时有导通电阻、电流或封装、耐压等边界。","不同脉宽下还有热功率限制。","部分高压线性区会受到热不稳定限制。","应使用具体器件完整SOA及脚注，取更严格的约束。"],"takeaway":"热功率线只是SOA的一部分。","formula":null,"sources":[{"title":"Linear Mode Operation and Safe Operating Diagram of Power-MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-applicationnote-linear-mode-operation-safe-operation-diagram-mosfets-applicationnotes-en.pdf"},{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"},{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"}],"visual":{"kind":"soa","labels":["RDS,on 边界","电流边界","耐压边界","热与热失稳边界"],"values":{"mode":"boundaries","qualitative":true}},"sourceKnowledgePointIds":["SOA06"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-10","title":"热功率线上的允许功率怎样估算？","pitfall":"把均匀热模型生成的一条功率线当整张SOA。","steps":["先求允许的结壳温差：175−80=95K。","再除以匹配脉宽的0.43K/W。","得到约221W，只代表该理想恒功率矩形的均匀热限制。","真实器件其他边界可能更严格，变功率启动也不能直接当恒功率。"],"takeaway":"这个结果是单项热约束，不是总安全认证。","formula":{"expression":"Pmax,thermal = (Tj,max−Tc)/Zth(tp)","variables":[{"symbol":"Pmax,thermal","meaning":"矩形脉冲的均匀热功率限制","unit":"W"},{"symbol":"Tj,max","meaning":"最高结温","unit":"°C"},{"symbol":"Tc","meaning":"规定壳温","unit":"°C"},{"symbol":"Zth(tp)","meaning":"匹配脉宽和重复条件的热阻","unit":"K/W"},{"symbol":"tp","meaning":"矩形脉宽","unit":"s"}],"substitution":"(175−80)÷0.43≈220.9W。","explanation":"数值由片内示意参数补算，不是实际器件SOA。","conditions":["矩形恒功率、固定壳温，不能覆盖局部热点。"],"origin":"原片公式，审阅补算与限定"},"sources":[{"title":"Linear Mode Operation and Safe Operating Diagram of Power-MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-applicationnote-linear-mode-operation-safe-operation-diagram-mosfets-applicationnotes-en.pdf"},{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"},{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"}],"visual":{"kind":"soa","labels":["95 K 温差预算","0.43 K/W","约 221 W 热限制","仍查其他边界"],"values":{"mode":"thermal-limit","Tmax_C":175,"Tcase_C":80,"Zth_K_W":0.43,"power_W":220.9302}},"sourceKnowledgePointIds":["SOA06"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-11","title":"缓启动在 SOA 上是一个点，还是一条轨迹？","pitfall":"把起始48V、10A当作持续10.6ms不变的工作点。","steps":["理想恒流启动时，电流约为10A。","随着输出充电，MOS电压从48V逐步下降。","实际应力沿图移动，并带着时间和热历史。","用最高电压、最高电流覆盖整段只是保守包络；包络越界不自动证明真实过程必坏。"],"takeaway":"看轨迹和持续时间，不只看起始一点。","formula":null,"sources":[{"title":"Linear Mode Operation and Safe Operating Diagram of Power-MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-applicationnote-linear-mode-operation-safe-operation-diagram-mosfets-applicationnotes-en.pdf"},{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"},{"title":"MOSFET Safe Operating Area and Hot Swap Circuits","url":"https://www.analog.com/en/resources/technical-articles/mosfet-safe-operating-area-and-hot-swap-circuits.html"}],"visual":{"kind":"soa","labels":["实际启动轨迹","48→0 V","10 A 示例","矩形包络≠真实波形"],"values":{"mode":"trajectory","Vds_start_V":48,"Vds_end_V":0,"current_A":10,"duration_ms":10.56,"qualitative_soa":true}},"sourceKnowledgePointIds":["SOA07"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-12","title":"壳温从 25°C 升到 80°C，63% 应该怎么用？","pitfall":"把整张SOA的电压、电流和每种边界全部乘63%。","steps":["最高结温175°C时，参考温差是150K，新温差是95K。","热功率预算比例为95÷150≈63.3%。","固定电压下的均匀热功率电流线可按这一比例变化。","耐压、封装电流及其他边界按各自规则；充分导通的热受限电流还涉及平方根。"],"takeaway":"63%是热功率比例，不是所有边界的统一缩放。","formula":{"expression":"kP = (Tj,max−Tc,new)/(Tj,max−Tc,ref)","variables":[{"symbol":"kP","meaning":"热功率限制比例","unit":"1"},{"symbol":"Tj,max","meaning":"最高结温","unit":"°C"},{"symbol":"Tc,new","meaning":"新壳温","unit":"°C"},{"symbol":"Tc,ref","meaning":"参考壳温","unit":"°C"}],"substitution":"(175−80)÷(175−25)=0.6333≈63.3%。","explanation":"只对相应热限制部分使用，热失稳区还要按厂商方法。","conditions":["不把电压轴或封装电流极限一并乘0.633。","同一热态电阻假设下，导通热受限电流比例约√0.633≈79.6%。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"Linear Mode Operation and Safe Operating Diagram of Power-MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-applicationnote-linear-mode-operation-safe-operation-diagram-mosfets-applicationnotes-en.pdf"},{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"},{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"}],"visual":{"kind":"soa","labels":["25°C 参考","80°C 新壳温","热预算 63.3%","不是整图缩放"],"values":{"mode":"derating","Tmax_C":175,"Tcase_C":[25,80],"power_factor":0.633333,"current_ohmic_factor":0.795822}},"sourceKnowledgePointIds":["SOA08"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-13","title":"整体温度没超标，为什么局部仍可能失效？","pitfall":"以为整片平均温升能排除所有线性工作区热点。","steps":["核查补充：在某些偏置下，局部升温会让该处电流增加。","更多电流又带来更多局部发热，形成正反馈。","这与充分导通时常见的电阻温度效应不能混为一谈。","应使用厂商确认的线性SOA，不能只凭低RDS,on选管。"],"takeaway":"局部热失稳可能先于整体温度上限；原片未展开这一机制。","formula":null,"sources":[{"title":"Linear Mode Operation and Safe Operating Diagram of Power-MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-applicationnote-linear-mode-operation-safe-operation-diagram-mosfets-applicationnotes-en.pdf"},{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"}],"visual":{"kind":"thermal","labels":["局部升温","局部电流增加","正反馈风险","查线性 SOA"],"values":{"mode":"hotspot","qualitative":true,"source_addition":true}},"sourceKnowledgePointIds":["SOA09"],"contentOrigin":"核查补充：原片未观察到热点或ZTC讲解"},{"id":"SOA-14","title":"把 10 A 降成 3 A，时间和风险怎样改变？","pitfall":"认为把启动放慢就必然安全。","steps":["相同电容和电压下，3A充电时间变成约35.2ms。","起始功率降到144W，平均功率约72W。","脉冲时间变长，必须改用对应热响应并重新查SOA。","片内约116°C仍是平均法粗估，没有证明所有3A方案安全。"],"takeaway":"减小电流有帮助，但必须重新计算更长的过程。","formula":{"expression":"tp = C·ΔV/I","variables":[{"symbol":"tp","meaning":"恒流充电时长","unit":"s"},{"symbol":"C","meaning":"输出电容","unit":"F"},{"symbol":"ΔV","meaning":"充电电压变化","unit":"V"},{"symbol":"I","meaning":"净充电电流","unit":"A"}],"substitution":"0.0022×48÷3=0.0352s=35.2ms。","explanation":"原片约35ms；其他功率数来自同一48V、3A条件。","conditions":["无并联负载、恒流、初始0V。","不是单独把原来10.6ms热阻数继续使用。"],"origin":"原片公式，补充适用条件"},"sources":[{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"},{"title":"MOSFET Safe Operating Area and Hot Swap Circuits","url":"https://www.analog.com/en/resources/technical-articles/mosfet-safe-operating-area-and-hot-swap-circuits.html"}],"visual":{"kind":"soa","labels":["10 A → 3 A","10.56 → 35.2 ms","峰值 144 W","重新核查"],"values":{"mode":"current-reduction","currents_A":[10,3],"times_ms":[10.56,35.2],"peaks_W":[480,144],"averages_W":[240,72]}},"sourceKnowledgePointIds":["SOA10"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-15","title":"充电电流变小，总发热能量也一定变小吗？","pitfall":"把较低功率误当成同等比例更少的总能量。","steps":["在理想无负载、初始0V的线性充电模型里，MOS耗散与电流无关。","用电容和输入电压计算，得到2.5344J。","10A过程功率高、时间短，3A过程功率低、时间长。","总能量相同不等于最高结温相同，热响应仍然重要。"],"takeaway":"减流主要改变功率与时间分布，不能只看总能量。","formula":{"expression":"EMOS = ½·C·Vin²","variables":[{"symbol":"EMOS","meaning":"该理想充电过程MOS耗散能量","unit":"J"},{"symbol":"C","meaning":"输出电容","unit":"F"},{"symbol":"Vin","meaning":"稳定输入电压","unit":"V"}],"substitution":"½×0.0022×48²=2.5344J。","explanation":"另一半输入能量存进电容；这里并非全部电源供能。","conditions":["初始0V、无负载、理想恒流至Vin，忽略其他压降和控制过渡。"],"origin":"核查补充：原片只列平均功率"},"sources":[{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"}],"visual":{"kind":"energy","labels":["10 A：短而高","3 A：长而低","均为 2.5344 J","峰温仍不同"],"values":{"kindDetail":"startup-energy","C_uF":2200,"Vin_V":48,"energy_J":2.5344}},"sourceKnowledgePointIds":["SOA04","SOA10"],"contentOrigin":"原片观点，经核查补充条件"},{"id":"SOA-16","title":"怎样把缓启动设计收成可靠的检查步骤？","pitfall":"用“电压×电流×时间”直接当温度，或拿示意参数替代真实数据表。","steps":["取得启动VDS和ID波形，确认负载、初始电压和重复周期。","从功率历史求热响应，并检查真实器件SOA与温度降额。","同时考虑降低限流、改善实际热路径和散热、选择有线性SOA依据的器件。","把假设、参数来源和裕量写清楚；原片器件参数明确为示意。"],"takeaway":"波形、热模型和真实SOA三者齐全，才有依据评估。","formula":null,"sources":[{"title":"Linear Mode Operation and Safe Operating Diagram of Power-MOSFETs","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-applicationnote-linear-mode-operation-safe-operation-diagram-mosfets-applicationnotes-en.pdf"},{"title":"AN50006 — Power MOSFETs in linear mode","url":"https://assets.nexperia.com/documents/application-note/AN50006.pdf"},{"title":"MOSFET Safe Operating Area and Hot Swap Circuits","url":"https://www.analog.com/en/resources/technical-articles/mosfet-safe-operating-area-and-hot-swap-circuits.html"},{"title":"AN11158 — Understanding power MOSFET data sheet parameters","url":"https://assets.nexperia.com/documents/application-note/AN11158.pdf"}],"visual":{"kind":"soa","labels":["波形","热响应","真实 SOA","条件与裕量"],"values":{"mode":"checklist","qualitative":true}},"sourceKnowledgePointIds":["SOA01","SOA10","SOA11"],"contentOrigin":"原片观点，经核查补充条件"}],"reviewStatus":"实际原片画面按2秒间隔抽样，关键帧另行细读；非逐帧连续观看","audio":"不使用原片音轨；本模块无音频。音轨是否含解说未独立听辨，按用户说明以画面为教学内容。","sourceScope":"原片可见知识重述；核查补充均标明，不复制原片美术。"},{"id":"7696559417958218417","key":"desat","title":"DESAT：怎样在短路时及时退出？","intro":"学会用导通时的VCE识别严重故障，理解检测门槛、充电延时、软关断和完整保护预算。","sourceUrl":"https://www.douyin.com/video/7696559417958218417","scope":"本模块来自这条已审画面及独立核验；不是原片逐字转录。示意动画不代表实测，补充算例另作标注。","lessons":[{"id":"desat-urgency","title":"短路为什么要在微秒内处理？","pitfall":"以为有电流限制就能长期维持短路。","steps":["短路时器件可能同时承受大电流和高电压。","瞬时功率迅速升高，热量还来不及扩散。","查具体器件在指定条件下允许的短路时间。"],"takeaway":"10µs是原片示例，不是所有IGBT统一能力。","formula":{"expression":"p=VCE IC","variables":[{"symbol":"p","meaning":"瞬时耗散功率","unit":"W"},{"symbol":"VCE","meaning":"集电极对发射极电压","unit":"V"},{"symbol":"IC","meaning":"集电极电流","unit":"A"}],"substitution":"原片示例：600V×400A=240kW。","explanation":"瓦数表示每秒发热速度，实际损伤还与持续时间和器件有关。","conditions":"4倍额定电流、600V和10µs均非通则；具体VGE、母线、初始结温必须匹配。"},"sources":[{"title":"Infineon IKW40N120T2 datasheet, Rev. 2.4 (2014)","url":"https://www.infineon.com/assets/row/public/documents/60/49/infineon-ikw40n120t2-datasheet-en.pdf"}],"visual":{"kind":"desat","labels":["高VCE","大IC","快速保护窗口"],"values":{"voltage_V":600,"current_A":400,"power_W":240000,"exampleWindow_us":10,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_corrected","sourcePointIds":["K1"],"sourceSummary":"从短路大电流和高VCE引出微秒级保护窗口。","addedOrCorrected":"保留风险机制，限定耐短路时间和电流倍数。"}},{"id":"desat-clue","title":"怎样从导通压降发现退饱和？","pitfall":"以为栅极已开通，就不必看器件两端电压。","steps":["正常导通时，IGBT的VCE通常较低。","严重故障可能让器件进入高电压、大电流状态。","在正确检测时间窗监视VCE是否异常升高。"],"takeaway":"VCE是故障线索，不能脱离栅压、温度与器件特性解释。","formula":null,"sources":[{"title":"Infineon DESAT: Desaturation protection for automotive gate drivers (2023)","url":"https://community.infineon.com/t5/Knowledge-Base-Articles/DESAT-Desaturation-protection-for-automotive-gate-drivers/ta-p/396975"},{"title":"Infineon IKW40N120T2 datasheet, Rev. 2.4 (2014)","url":"https://www.infineon.com/assets/row/public/documents/60/49/infineon-ikw40n120t2-datasheet-en.pdf"}],"visual":{"kind":"desat","labels":["低压导通区","高压大电流区","检测时间窗"],"values":{"normalExample_V":1.7,"faultExample_V":600,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["K2"],"sourceSummary":"以输出曲线说明导通时VCE通常较低，严重故障时电流受栅压控制、VCE上升。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"desat-normal","title":"检测脚为什么比VCE多出1.2V？","pitfall":"认为DESAT引脚直接等于集电极电压。","steps":["小检测电流流经串阻和高压二极管。","检测点比集电极多出电阻压降和二极管压降。","所有电压都相对于当地发射极参考。"],"takeaway":"读检测门槛前，先算中间元件的压降。","formula":{"expression":"VDESAT≈VCE+VF+ICHG R","variables":[{"symbol":"VDESAT","meaning":"检测脚电压","unit":"V"},{"symbol":"VCE","meaning":"集电极对发射极电压","unit":"V"},{"symbol":"VF","meaning":"检测二极管压降","unit":"V"},{"symbol":"ICHG","meaning":"检测充电电流","unit":"A"},{"symbol":"R","meaning":"检测串阻","unit":"Ω"}],"substitution":"原片：1.7+0.7+500µA×1kΩ=2.9V。","explanation":"沿小电流路径，把串联压降逐项加起来。","conditions":"稳态、二极管正向导通的近似；VF随电流与温度变化。"},"sources":[{"title":"Infineon DESAT: Desaturation protection for automotive gate drivers (2023)","url":"https://community.infineon.com/t5/Knowledge-Base-Articles/DESAT-Desaturation-protection-for-automotive-gate-drivers/ta-p/396975"}],"visual":{"kind":"desat","labels":["VCE 1.7V","VF 0.7V","IR 0.5V"] ive":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_corrected","sourcePointIds":["P1"],"sourceSummary":"100 V MOS 用于最高72 V母线，作者估算尖峰后只剩约1 V名义余量。","addedOrCorrected":"保留一阶风险估算，撤掉必然烧毁或一律150V的推断。"}},{"id":"audit-discharge","title":"关断抽走10nC大约要多久？","pitfall":"拿手册某个开关时间直接套不同驱动。","steps":["先确定正在变化的电荷区间，不是直接用全部Qg。","按该阶段的栅压和实际关断阻抗估算抽电荷电流。","用电荷除以电流得到初步时间，再测量修正。"],"takeaway":"电荷、平台、阻抗必须来自对应工况。","formula":{"expression":"tfi≈ΔQgs/Ig,off","variables":[{"symbol":"tfi","meaning":"电流下降近似时间","unit":"s"},{"symbol":"ΔQgs","meaning":"对应阶段电荷","unit":"C"},{"symbol":"Ig,off","meaning":"该阶段近似栅电流","unit":"A"}],"substitution":"原片取Ig≈4.2V/10.8Ω=0.389A；10nC/0.389A≈25.7ns。","explanation":"单位库仑除以安培就是秒。","conditions":"Ig并非恒定；电荷测试为50V/25A，设计每管峰值不同，驱动器内阻还需加入。"},"sources":[{"title":"Infineon ISC019N10NM8 datasheet, Rev.1.1, 2025-12-11","url":"https://www.infineon.com/assets/row/public/documents/24/49/infineon-isc019n10nm8-datasheet-en.pdf"},{"title":"TI Fundamentals of MOSFET and IGBT Gate Driver Circuits, SLUA618A","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"}],"visual":{"kind":"gate","labels":["10nC区间","抽电荷电流","约25.7ns"],"values":{"charge_nC":10,"current_A":0.3888888888888889,"time_ns":25.714285714285715,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["P1"],"sourceSummary":"100 V MOS 用于最高72 V母线，作者估算尖峰后只剩约1 V名义余量。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"audit-miller","title":"关断管为什么也会冒出正栅压？","pitfall":"以为驱动输出0V就一定不受对管影响。","steps":["对管切换时，漏极电压快速变化。","栅漏电容把电荷送到本管栅极，关断通路需要把它泄走。","检查本地VGS，必要时加强关断、采用钳位或合适负压。"],"takeaway":"要验证实际耦合和泄流，跨过小电流阈值只表示风险。","formula":{"expression":"ΔVg≈Ic R[1−exp(−t/(RCeq))]","variables":[{"symbol":"ΔVg","meaning":"耦合造成的栅压增量","unit":"V"},{"symbol":"Ic","meaning":"模型中恒定耦合电流","unit":"A"},{"symbol":"R","meaning":"关断等效电阻","unit":"Ω"},{"symbol":"Ceq","meaning":"等效栅节点电容","unit":"F"},{"symbol":"t","meaning":"干扰持续时间","unit":"s"}],"substitution":"原片复现模型：1A、10.8Ω、6.61nF、26ns，ΔVg≈3.30V。","explanation":"电容先充电，电阻逐步泄流，所以不是一开始就达到IcR。","conditions":"Ceq为复现近似；真实电容和电流随偏压变化，不能当实测直通电流。"},"sources":[{"title":"Infineon ISC019N10NM8 datasheet, Rev.1.1, 2025-12-11","url":"https://www.infineon.com/assets/row/public/documents/24/49/infineon-isc019n10nm8-datasheet-en.pdf"},{"title":"Infineon 2ED2184S06F / 2ED21844S06J datasheet V2.32","url":"https://www.infineon.com/assets/row/public/documents/24/49/infineon-2ed2184-4-s06f-j-datasheet-en.pdf"},{"title":"TI Fundamentals of MOSFET and IGBT Gate Driver Circuits, SLUA618A","url":"https://www.ti.com/lit/ml/slua618a/slua618a.pdf"},{"title":"Infineon Designing with power MOSFETs, V1.1","url":"https://www.infineon.com/assets/row/public/documents/24/42/infineon-designing-with-power-mosfets-applicationnotes-en.pdf?fileId=8ac78c8c7ddc01d7017e6c619a490f47"}],"visual":{"kind":"gate","labels":["对管dv/dt","Cgd耦合","本管泄流"],"values":{"coupled_A":1,"resistance_ohm":10.8,"capacitance_nF":6.61,"duration_ns":26,"bump_V":3.3,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_corrected","sourcePointIds":["P2"],"sourceSummary":"共用10 Ω开关栅阻、0/15 V驱动、无负压或米勒钳位。","addedOrCorrected":"保留一阶RC风险说明，不把曲线称为实测或证明任何电阻都无解。"}},{"id":"audit-drive-voltage","title":"把10V驱动改成15V一定更好吗？","pitfall":"只看导通电阻变小，忽略开关速度和耦合。","steps":["在同一数据表、温度和电流下比较RDS。","最大值要和最大值比，典型值要和典型值比。","再比较栅极应力、开关速度、驱动供电和损耗。"],"takeaway":"更高驱动电压是否划算，要看整套条件。","formula":{"expression":"改善比例=(R10−R15)/R10","variables":[{"symbol":"R10,R15","meaning":"10V与15V下同一统计口径导通电阻","unit":"mΩ"}],"substitution":"该型号最大值：(1.95−1.93)/1.95≈1.03%；典型值则约5.92%。","explanation":"不同统计列会得到不同百分比。","conditions":"同一25°C、50A条件；不代表热态每颗器件改善相同。"},"sources":[{"title":"Infineon ISC019N10NM8 datasheet, Rev.1.1, 2025-12-11","url":"https://www.infineon.com/assets/row/public/documents/24/49/infineon-isc019n10nm8-datasheet-en.pdf"},{"title":"Infineon 2ED2184S06F / 2ED21844S06J datasheet V2.32","url":"https://www.infineon.com/assets/row/public/documents/24/49/infineon-2ed2184-4-s06f-j-datasheet-en.pdf"}],"visual":{"kind":"gate","labels":["10V","15V","最大值比较"],"values":{"r10_mohm":1.95,"r15_mohm":1.93,"improvement_percent":1.0256,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_corrected","sourcePointIds":["P2"],"sourceSummary":"共用10 Ω开关栅阻、0/15 V驱动、无负压或米勒钳位。","addedOrCorrected":"原片约1%仅对应最大值，补足统计口径。"}},{"id":"audit-sense-path","title":"装了分流器，为什么还有故障看不见？","pitfall":"只问有没有采样元件，不画故障闭合路径。","steps":["从母线电容沿高侧管追到相线短路点。","若它直接回母线负端，可能绕过低侧分流器。","移动检测位置或增加覆盖该路径的保护，并核查完整延时。"],"takeaway":"保护只看得到真正流过检测点的电流。","formula":null,"sources":[{"title":"Infineon 2ED2184S06F / 2ED21844S06J datasheet V2.32","url":"https://www.infineon.com/assets/row/public/documents/24/49/infineon-2ed2184-4-s06f-j-datasheet-en.pdf"},{"title":"TI INA241x datasheet SBOSA30D","url":"https://www.ti.com/lit/ds/symlink/ina241a.pdf"},{"title":"TI Best Practices for Board Layout of Motor Drivers, SLVA959B","url":"https://www.ti.com/lit/an/slva959b/slva959b.pdf"}],"visual":{"kind":"schematic","labels":["母线","高侧管","故障回路","低侧分流器盲区"],"values":{"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"source_explained","sourcePointIds":["P3"],"sourceSummary":"仅用低侧分流器且硬件只比正向电流。","addedOrCorrected":"补足初学者所需的定义、条件与独立图示。"}},{"id":"audit-sense-direction","title":"能测负电流，就一定能对负电流报警吗？","pitfall":"把放大器双向测量能力当成比较器双向保护。","steps":["中点参考让正负电流变成中点两侧的电压。","只接上限比较器，就可能漏掉低于中点的负向异常。","按需求设置上下门槛，并核对输出摆幅、公差和延时。"],"takeaway":"测量和跳闸是两层功能，必须分别检查。","formula":{"expression":"Vout=Vref+G I Rs","variables":[{"symbol":"Vout","meaning":"放大器输出","unit":"V"},{"symbol":"Vref","meaning":"零电流中点","unit":"V"},{"symbol":"G","meaning":"增益","unit":"V/V"},{"symbol":"I","meaning":"带方向电流","unit":"A"},{"symbol":"Rs","meaning":"分流电阻","unit":"Ω"}],"substitution":"自拟：1.65V+10×(±50A)×1mΩ，输出分别2.15V与1.15V。","explanation":"正负号决定输出在中点上方还是下方。","conditions":"不证明原板97A门槛；真实阈值还含放大器/比较器偏差。"},"sources":[{"title":"TI INA241x datasheet SBOSA30D","url":"https://www.ti.com/lit/ds/symlink/ina241a.pdf"}],"visual":{"kind":"schematic","labels":["负电流","1.65V中点","正电流","双阈值"],"values":{"reference_V":1.65,"gain":10,"shunt_mohm":1,"current_A":50,"positive_V":2.15,"negative_V":1.15,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"review_supplement","sourcePointIds":["P3"],"sourceSummary":"仅用低侧分流器且硬件只比正向电流。","addedOrCorrected":"把原片方向盲区拆成独立双向映射算例。"}},{"id":"audit-three-phase","title":"只限正向电流，负向一相能有多大？","pitfall":"以为三相每路都有正向比较器就覆盖了全部方向。","steps":["三线系统同一时刻的三相电流和为零。","一相的负电流可能由另两相正电流共同提供。","若两路正电流各低于门槛，负向那路仍可能接近门槛的两倍。"],"takeaway":"方向盲区不能靠三相求和自动补齐。","formula":{"expression":"ia+ib+ic=0","variables":[{"symbol":"ia,ib,ic","meaning":"同一方向约定的瞬时三相电流","unit":"A"}],"substitution":"自拟：−193A+96.5A+96.5A=0；正门槛若约97A，两正向路都可能未超限。","explanation":"电流守恒约束的是总和，不保证每个方向都被阈值覆盖。","conditions":"三线系统示例；实际PWM路径和采样可见性仍要核查，193A不是保证动作值。"},"sources":[{"title":"TI INA241x datasheet SBOSA30D","url":"https://www.ti.com/lit/ds/symlink/ina241a.pdf"},{"title":"TI Best Practices for Board Layout of Motor Drivers, SLVA959B","url":"https://www.ti.com/lit/an/slva959b/slva959b.pdf"}],"visual":{"kind":"schematic","labels":["负向一相","正向两相","正向门槛"],"values":{"phaseA_A":-193,"phaseB_A":96.5,"phaseC_A":96.5,"threshold_A":97,"isIllustrative":true},"notes":["固定画布、静音；按本页内容改变图中状态，不自动切页。","所有未指定器件的数值是教学示例，不视为安全保证。"]},"origin":{"type":"review_supplement","sourcePointIds":["P3"],"sourceSummary":"仅用低侧分流器且硬件只比正向电流。","addedOrCorrected":"明确原片近两倍阈值的条件，不当作实际动作测量。"}},{"id":"audit-sharing","title":"两颗并联，每颗电流就是50A除以2吗？","pitfall":"忘了上下管各自导通时间对RMS的影响。","steps":["先看相电流在一个电周期内的平方平均。","再看上、下管各承担哪些时段。","最后按并联器件实际均流程度分配每颗电流。"],"takeaway":"并联数量和导通时间都影响每颗发热。","formula":{"expression":"Idevice,rms≈Iphase,rms/(√2 n)","variables":[{"symbol":"Idevice,rms","meaning":"单颗MOS有效电流","unit":"A"},{"symbol":"Iphase,rms","meaning":"相电流有效值","unit":"A"},{"symbol":"n","meaning": </script><script>/* Original silent avalanche diagrams. Each lesson has its own fixed scene.
 * The host supplies the phase of an eight-second loop. A reversing cursor is
 * explicitly a replay cursor; it never means that heat or energy flows back.
 */
(function () {
  'use strict';
  const H = window.HardwareLessonVisuals = window.HardwareLessonVisuals || {};
  const C = { ink: '#18342f', green: '#276850', blue: '#386ac2', orange: '#c77c25', muted: '#657871', line: '#cbd9d2', grid: '#f0f4f1', pale: '#edf5ef', sky: '#edf2fa', sand: '#fbf2e4' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
  const num = (v, fallback = 0) => v != null && Number.isFinite(Number(v)) ? Number(v) : fallback;
  const fmt = (v, places = 2) => v != null && Number.isFinite(Number(v)) ? String(Number(Number(v).toFixed(places))) : '—';
  const phase = p => ((num(p) % 1) + 1) % 1;
  const replay = p => (1 - Math.cos(2 * Math.PI * phase(p))) / 2;
  const values = lesson => lesson.visual && lesson.visual.values || {};
  const text = (x, y, s, size = 22, color = C.ink, anchor = 'start', weight = 400) => `<text x="${x}" y="${y}" font-size="${size}" fill="${color}" text-anchor="${anchor}" font-weight="${weight}">${esc(s)}</text>`;
  const line = (x1, y1, x2, y2, color = C.line, width = 2, dash = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  const path = (d, color = C.green, width = 3, fill = 'none', extra = '') => `<path d="${d}" stroke="${color}" stroke-width="${width}" fill="${fill}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  const poly = (points, color = C.green, width = 3) => path(points.map((q, i) => `${i ? 'L' : 'M'}${q[0]},${q[1]}`).join(' '), color, width);
  const rect = (x, y, w, h, fill = '#fff', stroke = C.line, r = 9) => `<rect x="${x}" y="${y}" width="${Math.max(0, w)}" height="${Math.max(0, h)}" rx="${r}" fill="${fill}" stroke="${stroke}"/>`;
  const dot = (x, y, color = C.orange, r = 6) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}"/>`;
  const clamp = x => Math.max(0, Math.min(1, num(x)));
  function wrap(s, max) {
    let row = '', length = 0; const out = [];
    for (const c of String(s)) { const w = /[\x00-\xff]/.test(c) ? 0.56 : 1; if (row && length + w > max) { out.push(row); row = ''; length = 0; } row += c; length += w; }
    if (row) out.push(row); return out;
  }
  const words = (x, y, s, max = 18, size = 21, color = C.ink, gap = 29) => wrap(s, max).map((r, i) => text(x, y + i * gap, r, size, color)).join('');
  function base(title, body, note = '原理示意，非实测或安全判据；往返光标仅表示回看。') {
    let grid = ''; for (let x = 40; x < 900; x += 40) grid += line(x, 75, x, 468, C.grid, 1); for (let y = 90; y < 468; y += 40) grid += line(30, y, 870, y, C.grid, 1);
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="${esc(title)}" font-family="Microsoft YaHei, PingFang SC, sans-serif"><title>${esc(title)}</title><rect width="900" height="540" fill="#fff"/>${grid}${text(36, 43, title, 26, C.ink, 'start', 700)}${line(36, 64, 864, 64)}${body}${line(36, 477, 864, 477)}${wrap(note, 44).slice(0, 2).map((s, i) => text(36, 502 + 24 * i, s, 18, C.muted)).join('')}</svg>`;
